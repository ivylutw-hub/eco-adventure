<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>毛孩之家｜互動遊戲</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5ead7;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif} .wrap{padding:12px}

/* ===== 毛孩之家 V6：溫馨木屋互動遊戲 ===== */
.pet-home-section{width:min(1480px,calc(100% - 24px));margin:12px auto 24px;padding:0;background:transparent;border:0;box-shadow:none}
.pet-v6-shell{overflow:hidden;border:2px solid #9b632f;border-radius:24px;background:#f8deb0;box-shadow:0 14px 34px rgba(92,55,24,.16);color:#5b381f;font-family:inherit}
.pet-v6-top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(#c98a4c,#b87538);border-bottom:3px solid #90592d;color:#fff9e8}
.pet-v6-title{display:flex;align-items:center;gap:8px;font-size:25px;text-shadow:0 2px #7d4d26}.pet-v6-title span{font-size:30px}.pet-v6-title b{font-weight:1000}
.pet-v6-message{justify-self:center;padding:8px 16px;border-radius:18px;background:#fff1c8;color:#754722;font-weight:900;border:2px solid #a66c38}
.pet-v6-wallet{padding:8px 14px;border-radius:18px;background:#fff4cf;color:#69421f;border:2px solid #a66c38;font-size:18px}
.pet-v6-level{display:flex;align-items:center;gap:8px;font-weight:1000}.pet-v6-level>div{width:120px;height:13px;border-radius:999px;background:#87542b;overflow:hidden;border:1px solid #70431f}.pet-v6-level i{display:block;height:100%;background:linear-gradient(90deg,#ffd33f,#ff9f28)}
.pet-v6-room{position:relative;display:grid;grid-template-columns:245px 1fr 210px;min-height:570px;background:linear-gradient(180deg,#f8e6c3 0 76%,#d8a365 76%);isolation:isolate}
.pet-v6-room:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.32;background-image:linear-gradient(90deg,rgba(111,69,35,.08) 1px,transparent 1px),linear-gradient(rgba(111,69,35,.07) 1px,transparent 1px);background-size:72px 72px}
.pet-v6-left,.pet-v6-right{padding:18px 14px;z-index:3}.pet-v6-left{border-right:1px solid rgba(113,74,39,.18)}.pet-v6-right{border-left:1px solid rgba(113,74,39,.18)}
.pet-v6-love,.pet-v6-missions,.pet-v6-quick-title,.pet-v6-tip{border:2px solid #b9824b;background:#fff8e7;border-radius:18px;box-shadow:0 5px 12px rgba(90,55,24,.08)}
.pet-v6-love{display:grid;grid-template-columns:auto 1fr;align-items:center;padding:12px;margin-bottom:12px}.pet-v6-love>span{grid-row:1/3;font-size:42px;margin-right:8px}.pet-v6-love small{font-weight:900}.pet-v6-love strong{font-size:28px;color:#d25563}
.pet-v6-missions{overflow:hidden;margin-bottom:12px}.pet-v6-missions h3{margin:0;padding:10px 12px;background:#a96b31;color:#fff7df;font-size:16px}.pet-v6-mission-row{display:grid;grid-template-columns:25px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #ead3ae;font-size:13px}.pet-v6-mission-row .box{width:20px;height:20px;border:2px solid #a77745;border-radius:5px;display:grid;place-items:center;background:#fff}.pet-v6-mission-row.done .box{background:#6dbd4f;color:white;border-color:#4e9f38}.pet-v6-mission-row em{font-style:normal;color:#8b5c34}.pet-v6-reward{padding:10px 12px;font-weight:1000;color:#7d4d26}
.pet-v6-pets{display:flex;gap:8px}.pet-v6-switch{flex:1;border:2px solid #cfac7a;border-radius:14px;background:#fff7e4;padding:5px;cursor:pointer;transition:.18s}.pet-v6-switch:hover{transform:translateY(-2px)}.pet-v6-switch.active{border-color:#e69b25;background:#ffe7a1;box-shadow:0 0 0 3px rgba(255,191,45,.2)}.pet-v6-switch img{width:100%;height:70px;object-fit:contain;display:block}.pet-v6-switch span{font-weight:1000;color:#674024}
.pet-v6-stage{position:relative;min-width:0;overflow:hidden}.pet-v6-window{position:absolute;left:30px;top:20px;width:260px;height:150px;border:12px solid #b57b42;border-radius:14px;background:linear-gradient(#9ed9f7 0 65%,#7cc15b 65%);box-shadow:inset 0 0 0 5px #f8e6c3;display:flex;justify-content:space-around;align-items:flex-start;padding-top:20px;font-size:34px}.pet-v6-frames{position:absolute;left:330px;top:36px;display:flex;gap:14px}.pet-v6-frames span{display:grid;place-items:center;width:54px;height:64px;border:8px solid #a56d36;border-radius:5px;background:#fff1ce;font-size:22px}
.pet-v6-cat-tree{position:absolute;right:35px;top:70px;width:115px;height:180px;border-radius:50% 50% 15px 15px;background:#bb8148;display:grid;place-items:start center;padding-top:8px;font-size:30px;box-shadow:inset 0 -80px 0 #a06b38}
.pet-v6-bed{position:absolute;left:55px;bottom:80px;width:165px;height:70px;border-radius:50%;background:#8aac55;box-shadow:inset 0 -20px 0 #779647,0 8px 0 rgba(98,62,33,.12)}
.pet-v6-house{position:absolute;right:30px;bottom:100px;font-size:105px;filter:saturate(.9)}
.pet-v6-bowl{position:absolute;right:155px;bottom:55px;font-size:48px}.pet-v6-water{position:absolute;right:95px;bottom:60px;font-size:42px}.pet-v6-toys{position:absolute;left:210px;bottom:55px;font-size:38px}
.pet-v6-animal-wrap{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);width:min(40vw,330px);height:360px;border:0;background:transparent;cursor:pointer;padding:0;z-index:5}.pet-v6-animal{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 10px rgba(94,57,27,.2));transform-origin:50% 85%;transition:.2s}
.pet-v6-animal-wrap:hover .pet-v6-animal{transform:translateY(-5px) scale(1.02)}
.pet-v6-speech{position:absolute;left:61%;top:150px;z-index:7;max-width:190px;padding:12px 16px;border:3px solid #ad7744;border-radius:18px;background:#fff9e9;font-weight:1000;opacity:0;transform:translateY(8px);pointer-events:none}.pet-v6-speech:after{content:"";position:absolute;left:24px;bottom:-17px;border:9px solid transparent;border-top-color:#ad7744}.pet-v6-speech.show{animation:speech 2.8s ease}
.pet-v6-name-card{position:absolute;left:20px;bottom:20px;z-index:6;min-width:175px;padding:10px 12px;border:2px solid #bb8650;border-radius:15px;background:#fff8e9}.pet-v6-name-card>b{font-size:18px}.pet-v6-name-card>span{float:right;color:#d55464;font-weight:1000}.pet-v6-name-card small{display:block;margin:3px 0 7px}.pet-v6-name-card button{border:0;border-radius:9px;padding:5px 8px;background:#78b84c;color:#fff;font-weight:900}
.pet-v6-stats{position:absolute;top:205px;left:20px;width:255px;z-index:6;padding:10px;border:2px solid #bb8650;border-radius:16px;background:rgba(255,249,232,.94)}.pet-v6-stat{display:grid;grid-template-columns:24px 45px 1fr 28px;align-items:center;gap:5px;margin:6px 0;font-size:11px}.pet-v6-track{height:11px;border-radius:99px;background:#e2d1b5;overflow:hidden}.pet-v6-track i{display:block;height:100%;border-radius:inherit}.pet-v6-track .pink{background:#ef7183}.pet-v6-track .orange{background:#f2ad38}.pet-v6-track .green{background:#79be4b}.pet-v6-track .blue{background:#4b9dde}
.pet-v6-right{display:flex;flex-direction:column;gap:10px;justify-content:flex-end}.pet-v6-quick-title{text-align:center;padding:9px;font-weight:1000}.pet-v6-right .quick{border:2px solid #b78555;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:left;font-size:22px}.pet-v6-right .quick b,.pet-v6-right .quick small{display:block;margin-left:34px}.pet-v6-right .quick b{margin-top:-26px;font-size:14px}.pet-v6-right .quick small{font-size:11px}.pet-v6-right .quick.pink{background:#f9b2b5}.pet-v6-right .quick.blue{background:#8fd5ec}.pet-v6-tip{padding:10px;font-size:11px;line-height:1.5}
.pet-v6-actions{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:13px 20px;background:#f4d395;border-top:3px solid #aa7139}.pet-v6-actions button{border:2px solid #b77b3e;border-radius:16px;background:linear-gradient(#fff7dc,#f4c96f);padding:9px 5px;cursor:pointer;box-shadow:0 4px 0 #9d6735;transition:.12s}.pet-v6-actions button:active{transform:translateY(3px);box-shadow:0 1px 0 #9d6735}.pet-v6-actions span{font-size:30px;display:block}.pet-v6-actions b{font-size:14px;color:#70431f}
.pet-float-heart{position:absolute;z-index:20;font-size:25px;pointer-events:none;animation:floatHeart 1.1s ease-out forwards}
.pet-anim-pet{animation:petBounce .7s ease}.pet-anim-feed{animation:petFeed .8s ease}.pet-anim-play{animation:petPlay .8s ease}.pet-anim-clean{animation:petClean .7s ease}.pet-anim-sleep{animation:petSleep 1.3s ease}.pet-anim-walk{animation:petWalk .9s ease}.pet-anim-click{animation:petBounce .55s ease}
@keyframes petBounce{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-22px) rotate(-4deg)}65%{transform:translateY(-8px) rotate(4deg)}}
@keyframes petFeed{0%,100%{transform:scale(1)}35%{transform:scale(.94) translateY(15px)}70%{transform:scale(1.06)}}
@keyframes petPlay{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-15px)}50%{transform:rotate(8deg) translateY(-25px)}75%{transform:rotate(-5deg) translateY(-10px)}}
@keyframes petClean{0%,100%{filter:drop-shadow(0 14px 10px rgba(94,57,27,.2))}50%{filter:drop-shadow(0 14px 10px rgba(94,57,27,.2)) brightness(1.2) saturate(.7)}}
@keyframes petSleep{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(4deg) scale(.97) translateY(8px)}}
@keyframes petWalk{0%,100%{transform:translateX(0)}25%{transform:translateX(-30px) translateY(-8px)}50%{transform:translateX(25px)}75%{transform:translateX(-12px) translateY(-5px)}}
@keyframes floatHeart{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) translateX(20px) scale(1.2)}}
@keyframes speech{0%{opacity:0;transform:translateY(8px)}10%,80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
@media(max-width:1050px){.pet-v6-room{grid-template-columns:210px 1fr}.pet-v6-right{display:none}.pet-v6-message{display:none}.pet-v6-top{grid-template-columns:auto 1fr auto}.pet-v6-level{justify-self:end}.pet-v6-stage{min-height:560px}}
@media(max-width:760px){.pet-home-section{width:calc(100% - 12px)}.pet-v6-top{grid-template-columns:1fr auto}.pet-v6-title{font-size:20px}.pet-v6-level{grid-column:1/-1}.pet-v6-level>div{flex:1}.pet-v6-room{display:block;min-height:770px}.pet-v6-left{border:0;padding:10px}.pet-v6-love,.pet-v6-missions{display:none}.pet-v6-pets{position:relative;z-index:10}.pet-v6-switch img{height:60px}.pet-v6-stage{min-height:650px}.pet-v6-window{left:15px;top:25px;width:190px;height:115px}.pet-v6-stats{top:155px;left:10px;width:215px}.pet-v6-animal-wrap{width:270px;height:330px;bottom:90px}.pet-v6-house{font-size:80px;right:8px}.pet-v6-name-card{left:10px;bottom:25px}.pet-v6-actions{grid-template-columns:repeat(3,1fr);padding:10px}.pet-v6-actions span{font-size:26px}.pet-v6-speech{left:auto;right:10px;top:210px;max-width:150px}}

</style>
</head>
<body><div class="wrap"><section id="petHomeSection" class="pet-home-section"><div id="petHomePanel"></div></section></div>
<script>
let st=JSON.parse(localStorage.getItem('petHomeV6')||'{"coins":1250}');
function save(){localStorage.setItem('petHomeV6',JSON.stringify(st))}
function header(){}
function toast(s){console.log(s)}
</script>
<script>
/* =========================================================
   毛孩之家 V6：溫馨木屋互動遊戲
   - 狗狗 / 貓咪 / 兔兔可切換
   - 餵食、玩耍、摸摸、清潔、睡覺、散步
   - 心情 / 飽足 / 清潔 / 活力 / 親密度
   - 每日任務與互動動畫
   - 共用主遊戲 st / save() / coins
   ========================================================= */
(function(){
  const KEY='petGuardian';
  const MAX=100;
  const PETS={
    dog:{name:'狗狗',defaultName:'旺旺',img:'pet-dog.png',sound:'汪！今天也一起玩吧！'},
    cat:{name:'貓咪',defaultName:'咪咪',img:'pet-cat.png',sound:'喵～陪我一下嘛！'},
    rabbit:{name:'兔兔',defaultName:'兔兔',img:'pet-rabbit.png',sound:'今天有胡蘿蔔嗎？'}
  };

  const clamp=(n,min=0,max=MAX)=>Math.max(min,Math.min(max,Number(n)||0));
  const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function today(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function ensure(){
    if(typeof st==='undefined')return null;
    if(!st[KEY]||typeof st[KEY]!=='object'){
      st[KEY]={adopted:true,petType:'dog',petName:'旺旺',hunger:80,clean:82,happy:76,trust:25,energy:85,totalCare:0};
    }
    const p=st[KEY];
    if(!PETS[p.petType])p.petType='dog';
    if(!p.petName)p.petName=PETS[p.petType].defaultName;
    ['hunger','clean','happy','trust','energy'].forEach(k=>p[k]=clamp(p[k]??(k==='trust'?25:80)));
    if(!p.game||typeof p.game!=='object')p.game={};
    const g=p.game;
    if(g.date!==today()){
      g.date=today();
      g.interactions=0;
      g.feeds=0;
      g.quizDone=0;
      g.rewardClaimed=false;
    }
    g.interactions=Number(g.interactions)||0;
    g.feeds=Number(g.feeds)||0;
    g.quizDone=Number(g.quizDone)||0;
    return p;
  }

  function toastPet(msg){
    if(typeof toast==='function')toast(msg);
    else console.log(msg);
  }

  function level(p){
    return Math.max(1,Math.floor((Number(p.totalCare)||0)/8)+1);
  }

  function relationTotal(p){
    return clamp(Math.round((p.trust*0.6+p.happy*0.4)));
  }

  function missionState(p){
    const g=p.game;
    return {
      feed:g.feeds>=3,
      interact:g.interactions>=3,
      quiz:g.quizDone>=1
    };
  }

  function missionDoneCount(p){
    return Object.values(missionState(p)).filter(Boolean).length;
  }

  function maybeReward(p){
    const done=missionState(p);
    if(done.feed&&done.interact&&done.quiz&&!p.game.rewardClaimed){
      p.game.rewardClaimed=true;
      st.coins=(Number(st.coins)||0)+50;
      toastPet('🎁 每日任務完成！獲得 50 枚守護金幣');
    }
  }

  function saveAndRender(action,message){
    const p=ensure();
    maybeReward(p);
    if(typeof save==='function')save();
    if(typeof header==='function')header();
    renderPetHome();
    requestAnimationFrame(()=>{
      const pet=document.getElementById('petGameAnimal');
      if(pet){
        pet.classList.remove('pet-anim-pet','pet-anim-feed','pet-anim-play','pet-anim-clean','pet-anim-sleep','pet-anim-walk','pet-anim-click');
        void pet.offsetWidth;
        pet.classList.add('pet-anim-'+(action||'click'));
      }
      makeHearts(action);
    });
    if(message)toastPet(message);
  }

  function makeHearts(action){
    const stage=document.getElementById('petGameStage');
    if(!stage)return;
    const icons=action==='feed'?['🥕','✨','💛']:action==='clean'?['🫧','✨','🫧']:['💗','✨','💖'];
    for(let i=0;i<5;i++){
      const s=document.createElement('span');
      s.className='pet-float-heart';
      s.textContent=icons[i%icons.length];
      s.style.left=(48+Math.random()*16)+'%';
      s.style.top=(35+Math.random()*20)+'%';
      s.style.animationDelay=(i*.06)+'s';
      stage.appendChild(s);
      setTimeout(()=>s.remove(),1200);
    }
  }

  function reaction(text){
    const b=document.getElementById('petSpeech');
    if(!b)return;
    b.textContent=text;
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
  }

  function interact(action){
    const p=ensure(); if(!p)return;
    const meta=PETS[p.petType];
    const rules={
      pet:{happy:6,trust:5,energy:0,hunger:0,clean:0,text:'最喜歡你摸摸我了！ 💕'},
      feed:{happy:2,trust:2,energy:2,hunger:16,clean:-1,cost:1,text:'好好吃！謝謝你～ 🥣'},
      play:{happy:13,trust:4,energy:-7,hunger:-4,clean:-2,text:'再玩一次！我還想玩！ 🧸'},
      clean:{happy:1,trust:2,energy:-1,hunger:0,clean:18,text:'香香乾淨，舒服多了！ 🫧'},
      sleep:{happy:3,trust:1,energy:22,hunger:-3,clean:0,text:'呼嚕呼嚕……充滿精神了！ 🌙'},
      walk:{happy:10,trust:5,energy:-6,hunger:-5,clean:-3,text:p.petType==='dog'?'散步最開心了！ 🦮':'一起活動好開心！ 🌿'}
    };
    const r=rules[action]; if(!r)return;
    const coins=Number(st.coins)||0;
    if((r.cost||0)>coins){toastPet('守護金幣不足，先去答題賺金幣吧！');return;}

    st.coins=coins-(r.cost||0);
    p.happy=clamp(p.happy+r.happy);
    p.trust=clamp(p.trust+r.trust);
    p.energy=clamp(p.energy+r.energy);
    p.hunger=clamp(p.hunger+r.hunger);
    p.clean=clamp(p.clean+r.clean);
    p.totalCare=(Number(p.totalCare)||0)+1;

    if(action==='feed')p.game.feeds++;
    if(['pet','play','walk','clean'].includes(action))p.game.interactions++;

    saveAndRender(action,r.text);
    setTimeout(()=>reaction(r.text),80);
  }

  function petClicked(){
    const p=ensure(); if(!p)return;
    p.happy=clamp(p.happy+1);
    const lines=[
      PETS[p.petType].sound,
      '今天也要一起守護動物喔！',
      '你來了！我一直在等你～',
      '摸摸我，我會更開心！',
      '一起完成今天的任務吧！'
    ];
    if(typeof save==='function')save();
    reaction(lines[Math.floor(Math.random()*lines.length)]);
    const pet=document.getElementById('petGameAnimal');
    if(pet){pet.classList.remove('pet-anim-click');void pet.offsetWidth;pet.classList.add('pet-anim-click');}
    makeHearts('pet');
  }

  function switchPet(type){
    const p=ensure(); if(!p||!PETS[type])return;
    p.petType=type;
    if(!p.names||typeof p.names!=='object')p.names={};
    p.petName=p.names[type]||PETS[type].defaultName;
    if(typeof save==='function')save();
    renderPetHome();
    setTimeout(()=>reaction(`嗨！我是${p.petName}～`),100);
  }

  function renamePet(){
    const p=ensure();if(!p)return;
    const input=prompt('幫毛孩取名字：',p.petName);
    if(input===null)return;
    const name=(input.trim()||p.petName).slice(0,10);
    p.petName=name;
    if(!p.names||typeof p.names!=='object')p.names={};
    p.names[p.petType]=name;
    if(typeof save==='function')save();
    renderPetHome();
  }

  function registerQuizDone(){
    const p=ensure(); if(!p)return;
    p.game.quizDone=Math.max(1,p.game.quizDone);
    maybeReward(p);
    if(typeof save==='function')save();
    renderPetHome();
  }

  window.petGameInteract=interact;
  window.petGameClick=petClicked;
  window.petGameSwitch=switchPet;
  window.renamePet=renamePet;
  window.petGameRegisterQuizDone=registerQuizDone;

  function bar(icon,label,value,cls){
    return `<div class="pet-v6-stat"><span>${icon}</span><b>${label}</b><div class="pet-v6-track"><i class="${cls}" style="width:${value}%"></i></div><strong>${value}</strong></div>`;
  }

  function petCard(type,p){
    const m=PETS[type],active=p.petType===type;
    return `<button class="pet-v6-switch ${active?'active':''}" onclick="petGameSwitch('${type}')">
      <img src="${m.img}" alt="${m.name}">
      <span>${p.names?.[type]||m.defaultName}</span>
    </button>`;
  }

  function missionLine(done,label,count){
    return `<div class="pet-v6-mission-row ${done?'done':''}">
      <span class="box">${done?'✓':''}</span><b>${label}</b><em>${count}</em>
    </div>`;
  }

  function renderPetHome(){
    const host=document.getElementById('petHomePanel');
    if(!host)return;
    const p=ensure();if(!p)return;
    const meta=PETS[p.petType],ms=missionState(p),done=missionDoneCount(p);
    const lv=level(p),rel=relationTotal(p);
    const coins=Number(st.coins)||0;

    host.innerHTML=`
      <div class="pet-v6-shell">
        <div class="pet-v6-top">
          <div class="pet-v6-title"><span>🏠</span><b>毛孩之家</b></div>
          <div class="pet-v6-message">每天都來陪陪毛孩，牠們會給你小驚喜喔！ 💗</div>
          <div class="pet-v6-wallet">🐾 <b>${coins}</b></div>
          <div class="pet-v6-level">⭐ Lv.${lv}<div><i style="width:${Math.min(100,(p.totalCare%8)/8*100)}%"></i></div></div>
        </div>

        <div class="pet-v6-room">
          <aside class="pet-v6-left">
            <div class="pet-v6-love">
              <span>💗</span><small>親密度總和</small><strong>${rel}</strong>
            </div>
            <div class="pet-v6-missions">
              <h3>每日任務 <small>(${done}/3)</small></h3>
              ${missionLine(ms.feed,'餵食毛孩 3 次',`${Math.min(3,p.game.feeds)}/3`)}
              ${missionLine(ms.interact,'和毛孩互動 3 次',`${Math.min(3,p.game.interactions)}/3`)}
              ${missionLine(ms.quiz,'完成 1 次問答',`${Math.min(1,p.game.quizDone)}/1`)}
              <div class="pet-v6-reward">完成獎勵： 🐾 +50</div>
            </div>
            <div class="pet-v6-pets">
              ${petCard('dog',p)}
              ${petCard('cat',p)}
              ${petCard('rabbit',p)}
            </div>
          </aside>

          <main class="pet-v6-stage" id="petGameStage">
            <div class="pet-v6-window"><span>☁️</span><span>🌿</span></div>
            <div class="pet-v6-frames"><span>🐾</span><span>🌱</span><span>💛</span></div>
            <div class="pet-v6-cat-tree">🧶</div>
            <div class="pet-v6-bed"></div>
            <div class="pet-v6-house">🏠</div>
            <div class="pet-v6-bowl">🥣</div>
            <div class="pet-v6-water">💧</div>
            <div class="pet-v6-toys">⚽　🧸</div>

            <div class="pet-v6-speech" id="petSpeech">嗨！我是 ${esc(p.petName)}～</div>
            <button class="pet-v6-animal-wrap" onclick="petGameClick()" aria-label="點擊${meta.name}">
              <img id="petGameAnimal" class="pet-v6-animal" src="${meta.img}" alt="${meta.name}">
            </button>

            <div class="pet-v6-name-card">
              <b>${esc(p.petName)}</b><span>💗 ${p.trust}</span>
              <small>${meta.name}・點牠會有反應喔！</small>
              <button onclick="renamePet()">✏️ 改名</button>
            </div>

            <div class="pet-v6-stats">
              ${bar('💗','心情',p.happy,'pink')}
              ${bar('🥣','飽足',p.hunger,'orange')}
              ${bar('🫧','清潔',p.clean,'green')}
              ${bar('⚡','活力',p.energy,'blue')}
            </div>
          </main>

          <aside class="pet-v6-right">
            <div class="pet-v6-quick-title">快速互動</div>
            <button class="quick pink" onclick="petGameInteract('pet')">💗 <b>一鍵抱抱</b><small>增加親密度</small></button>
            <button class="quick blue" onclick="petGameInteract('feed')">🥣 <b>一鍵餵食</b><small>消耗 🐾 1</small></button>
            <div class="pet-v6-tip">💡 每天互動可以提升親密度，親密度越高，毛孩的反應越豐富！</div>
          </aside>
        </div>

        <div class="pet-v6-actions">
          <button onclick="petGameInteract('feed')"><span>🥣</span><b>餵食</b></button>
          <button onclick="petGameInteract('play')"><span>🎾</span><b>玩耍</b></button>
          <button onclick="petGameInteract('pet')"><span>🤲</span><b>摸摸</b></button>
          <button onclick="petGameInteract('clean')"><span>🫧</span><b>清潔</b></button>
          <button onclick="petGameInteract('sleep')"><span>🌙</span><b>睡覺</b></button>
          <button onclick="petGameInteract('walk')"><span>🦮</span><b>散步</b></button>
        </div>
      </div>`;
  }

  window.renderPetHome=renderPetHome;

  function ensureUi(){
    const base=document.getElementById('basePage');
    if(!base)return;
    let section=document.getElementById('petHomeSection');
    if(!section){
      section=document.createElement('section');
      section.id='petHomeSection';
      section.className='pet-home-section';
      section.innerHTML=`<div id="petHomePanel"></div>`;
      const savePanel=base.querySelector('.save-panel');
      if(savePanel)base.insertBefore(section,savePanel);
      else base.appendChild(section);
    }
    renderPetHome();
  }

  function patch(name,after){
    const old=window[name];
    if(typeof old!=='function'||old.__petV6)return;
    const wrapped=function(){const r=old.apply(this,arguments);setTimeout(after,0);return r};
    wrapped.__petV6=true;window[name]=wrapped;
  }

  function install(){
    ensureUi();
    patch('showBase',()=>{ensureUi();renderPetHome()});
    patch('renderBase',()=>{ensureUi();renderPetHome()});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(install,250),{once:true});
  else setTimeout(install,250);
})();
</script>
<script>setTimeout(()=>renderPetHome(),50)</script>
</body></html>
