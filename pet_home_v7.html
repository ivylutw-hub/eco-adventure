<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>毛孩之家 V7 互動遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4e8d6;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
.page{padding:10px}
.hide{display:none!important}

/* ===== 守護基地上方快速切換 ===== */
.base-quick-tabs{
  display:flex;
  gap:10px;
  width:min(1480px,calc(100% - 24px));
  margin:14px auto 12px;
  padding:7px;
  border:1px solid #d7e6dd;
  border-radius:18px;
  background:#eef6f1;
  box-shadow:0 6px 16px rgba(42,83,67,.08);
}
.base-quick-tabs button{
  flex:1;
  min-height:50px;
  border:1px solid transparent;
  border-radius:14px;
  background:#f8fbf9;
  color:#6b7c75;
  font-weight:1000;
  font-size:16px;
  cursor:pointer;
  transition:all .18s ease;
}
.base-quick-tabs button:hover{
  background:#fff;
  color:#2f6f5d;
}
.base-quick-tabs button.active[data-mode="my"]{
  background:linear-gradient(135deg,#2c9474,#0b6b50);
  color:#fff;
  box-shadow:0 6px 15px rgba(11,107,80,.24);
}
.base-quick-tabs button.active[data-mode="pet"]{
  background:linear-gradient(135deg,#da9735,#bb6f26);
  color:#fff;
  box-shadow:0 6px 15px rgba(187,111,38,.22);
}
.base-mode-view.is-hidden,
.pet-home-section-v7.is-hidden{
  display:none !important;
}

/* ===== 毛孩之家 V7 ===== */
.pet-home-section-v7{
  width:min(1480px,calc(100% - 24px));
  margin:0 auto 24px;
  padding:0;
  background:transparent;
}
.pet-v7-shell{
  overflow:hidden;
  border:2px solid #9f6530;
  border-radius:26px;
  background:#f8dfb3;
  box-shadow:0 15px 36px rgba(92,55,24,.16);
  color:#5b3a1f;
}
.pet-v7-top{
  display:grid;
  grid-template-columns:auto 1fr auto 200px;
  align-items:center;
  gap:14px;
  padding:14px 18px;
  background:linear-gradient(#c9874a,#b9773a);
  border-bottom:3px solid #915a2e;
  color:#fff7e8;
}
.pet-v7-title{
  font-size:26px;
  font-weight:1000;
  text-shadow:0 2px #7b4c25;
}
.pet-v7-banner{
  padding:9px 16px;
  border:2px solid #ad7341;
  border-radius:18px;
  background:#fff1c9;
  color:#78491f;
  font-weight:900;
}
.pet-v7-wallet{
  padding:8px 14px;
  border:2px solid #a86f3d;
  border-radius:18px;
  background:#fff3d1;
  color:#69411d;
  font-size:18px;
  font-weight:1000;
  text-align:center;
}
.pet-v7-level{
  display:flex;
  flex-direction:column;
  gap:6px;
  font-weight:1000;
}
.pet-v7-level div{
  height:13px;
  border-radius:999px;
  background:#855128;
  border:1px solid #6f431f;
  overflow:hidden;
}
.pet-v7-level i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#ffd54c,#ff9f2c);
}
.pet-v7-room{
  position:relative;
  display:grid;
  grid-template-columns:250px 1fr 220px;
  min-height:590px;
  background:linear-gradient(180deg,#f8e7c5 0 76%,#d8a468 76%);
}
.pet-v7-room:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.28;
  background-image:
    linear-gradient(90deg,rgba(112,70,36,.08) 1px,transparent 1px),
    linear-gradient(rgba(112,70,36,.07) 1px,transparent 1px);
  background-size:72px 72px;
  pointer-events:none;
}
.pet-v7-left,.pet-v7-right{
  position:relative;
  z-index:2;
  padding:18px 14px;
}
.pet-v7-left{border-right:1px solid rgba(113,74,39,.16)}
.pet-v7-right{border-left:1px solid rgba(113,74,39,.16);display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.pet-v7-love,.pet-v7-missions,.pet-v7-side-box,.pet-v7-tip{
  border:2px solid #ba834d;
  border-radius:18px;
  background:#fff8e8;
  box-shadow:0 5px 13px rgba(88,55,24,.07);
}
.pet-v7-love{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:8px;
  align-items:center;
  padding:12px;
  margin-bottom:12px;
}
.pet-v7-love span{grid-row:1/3;font-size:42px}
.pet-v7-love small{font-weight:900}
.pet-v7-love strong{font-size:28px;color:#d25563}
.pet-v7-missions{overflow:hidden;margin-bottom:12px}
.pet-v7-missions h3{
  margin:0;
  padding:10px 12px;
  background:#aa6d33;
  color:#fff8e4;
  font-size:16px;
}
.pet-v7-mission-row{
  display:grid;
  grid-template-columns:24px 1fr auto;
  gap:8px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid #ecd7b2;
  font-size:13px;
}
.pet-v7-mission-row .box{
  width:20px;height:20px;
  border:2px solid #a87847;
  border-radius:6px;
  background:#fff;
  display:grid;place-items:center;
  font-size:12px;font-weight:1000;
}
.pet-v7-mission-row.done .box{
  background:#70bd52;
  border-color:#70bd52;
  color:#fff;
}
.pet-v7-mission-row em{font-style:normal;color:#8a6a4b;font-weight:900}
.pet-v7-reward{
  padding:11px 12px;
  font-weight:1000;
  color:#9b6020;
}
.pet-v7-pet-list{
  display:flex;
  gap:8px;
}
.pet-v7-switch{
  flex:1;
  border:2px solid #d0aa7a;
  border-radius:14px;
  background:#fff7e4;
  padding:6px;
  cursor:pointer;
  transition:all .18s ease;
}
.pet-v7-switch:hover{transform:translateY(-2px)}
.pet-v7-switch.active{
  border-color:#e49b26;
  background:#ffe7aa;
  box-shadow:0 0 0 3px rgba(255,191,43,.20);
}
.pet-v7-switch img{
  width:100%;
  height:76px;
  object-fit:contain;
  display:block;
}
.pet-v7-switch small,
.pet-v7-switch b{
  display:block;
  text-align:center;
}
.pet-v7-switch small{
  color:#7b5a38;
  font-weight:900;
}
.pet-v7-switch b{
  color:#5f3920;
  margin-top:2px;
  font-size:14px;
}

.pet-v7-stage{
  position:relative;
  overflow:hidden;
  min-width:0;
}
.pet-v7-window{
  position:absolute;
  left:30px;
  top:22px;
  width:255px;
  height:145px;
  border:12px solid #b57b42;
  border-radius:14px;
  background:
    radial-gradient(circle at 40px 30px,#fff6 0 18px,transparent 19px),
    radial-gradient(circle at 160px 45px,#fff7 0 16px,transparent 17px),
    linear-gradient(#98d8f7 0 64%,#7ebf57 64%);
  box-shadow:inset 0 0 0 5px #f7e4c4;
}
.pet-v7-wall-items{
  position:absolute;
  left:330px;
  top:38px;
  display:flex;
  gap:14px;
}
.pet-v7-wall-items span{
  width:54px;height:54px;
  border:6px solid #b57b42;
  border-radius:14px;
  background:#fff8e6;
  display:grid;place-items:center;
  font-size:24px;
}
.pet-v7-cat-tree{
  position:absolute;
  right:36px;
  top:74px;
  width:118px;
  height:182px;
  border-radius:46px 46px 16px 16px;
  background:
    radial-gradient(circle at 62% 18%,#ead39c 0 12px,transparent 13px),
    linear-gradient(#bb8249,#a66c39);
  box-shadow:inset 0 -82px 0 #9b6535;
}
.pet-v7-bed{
  position:absolute;
  left:56px;
  bottom:85px;
  width:172px;
  height:72px;
  border-radius:50%;
  background:#88ad54;
  box-shadow:inset 0 -20px 0 #789747,0 8px 0 rgba(98,62,33,.12);
}
.pet-v7-bowl{position:absolute;right:158px;bottom:60px;font-size:48px}
.pet-v7-water{position:absolute;right:102px;bottom:62px;font-size:42px}
.pet-v7-toys{position:absolute;left:220px;bottom:58px;font-size:38px}
.pet-v7-house{position:absolute;right:32px;bottom:108px;font-size:105px}

.pet-v7-speech{
  position:absolute;
  right:54px;
  top:165px;
  z-index:7;
  max-width:210px;
  padding:12px 16px;
  border:3px solid #ad7744;
  border-radius:18px;
  background:#fff9e9;
  font-weight:1000;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
}
.pet-v7-speech:after{
  content:"";
  position:absolute;
  left:28px;
  bottom:-18px;
  border:9px solid transparent;
  border-top-color:#ad7744;
}
.pet-v7-speech.show{
  animation:speechPop 2.7s ease;
}
.pet-v7-emotion{
  position:absolute;
  left:50%;
  top:128px;
  transform:translateX(110px);
  z-index:8;
  width:54px;height:54px;
  border-radius:50%;
  background:#fff6d9;
  border:3px solid #d59d42;
  display:grid;place-items:center;
  font-size:26px;
  opacity:0;
}
.pet-v7-emotion.show{
  animation:emotionPulse 1.3s ease;
}
.pet-v7-animal-wrap{
  position:absolute;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  width:min(42vw,330px);
  height:365px;
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
  z-index:5;
}
.pet-v7-animal{
  width:100%;
  height:100%;
  object-fit:contain;
  transform-origin:50% 86%;
  filter:drop-shadow(0 14px 10px rgba(95,59,27,.19));
}
.pet-v7-name-card{
  position:absolute;
  left:20px;
  bottom:20px;
  z-index:6;
  min-width:180px;
  padding:10px 12px;
  border:2px solid #bc8751;
  border-radius:15px;
  background:#fff8e9;
}
.pet-v7-name-card .main{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.pet-v7-name-card b{
  font-size:18px;
}
.pet-v7-name-card span{
  color:#cf5967;
  font-weight:1000;
  font-size:12px;
}
.pet-v7-name-card small{
  display:block;
  margin:4px 0 8px;
  color:#6f4b2e;
}
.pet-v7-name-card button{
  border:0;
  border-radius:10px;
  padding:6px 10px;
  background:#78b84d;
  color:#fff;
  font-weight:1000;
  cursor:pointer;
}
.pet-v7-stats{
  position:absolute;
  top:206px;
  left:20px;
  width:260px;
  z-index:6;
  padding:10px;
  border:2px solid #bc8751;
  border-radius:16px;
  background:rgba(255,249,233,.95);
}
.pet-v7-stat{
  display:grid;
  grid-template-columns:24px 45px 1fr 28px;
  align-items:center;
  gap:6px;
  margin:7px 0;
  font-size:11px;
}
.pet-v7-track{
  height:11px;
  border-radius:999px;
  background:#e3d2b6;
  overflow:hidden;
}
.pet-v7-track i{
  display:block;
  height:100%;
  border-radius:inherit;
}
.pet-v7-track .pink{background:#ef7487}
.pet-v7-track .orange{background:#f2af3a}
.pet-v7-track .green{background:#6ebe57}
.pet-v7-track .blue{background:#63a6ff}

.pet-v7-side-box{
  padding:12px;
}
.pet-v7-side-box b{
  display:block;
  margin-bottom:10px;
  font-size:16px;
}
.pet-v7-side-box .quick{
  width:100%;
  margin:7px 0;
  border:2px solid #b88754;
  border-radius:16px;
  padding:11px 10px;
  font-weight:1000;
  font-size:15px;
  cursor:pointer;
}
.pet-v7-side-box .quick.pink{background:#f8b2bc}
.pet-v7-side-box .quick.gold{background:#f4d87f}
.pet-v7-side-box .quick.mint{background:#bde6d6}
.pet-v7-tip{
  padding:12px;
  line-height:1.65;
  color:#70492a;
  font-size:13px;
}
.pet-v7-actions{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
  padding:14px 20px;
  background:#f4d397;
  border-top:3px solid #aa7139;
}
.pet-v7-actions button{
  border:2px solid #b77b3e;
  border-radius:16px;
  background:linear-gradient(#fff8df,#f4ca71);
  padding:10px 6px;
  cursor:pointer;
  box-shadow:0 4px 0 #9d6735;
  transition:.12s ease;
}
.pet-v7-actions button:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #9d6735;
}
.pet-v7-actions span{
  display:block;
  font-size:30px;
}
.pet-v7-actions b{
  font-size:14px;
  color:#72451f;
}

.pet-v7-float{
  position:absolute;
  z-index:20;
  font-size:24px;
  pointer-events:none;
  animation:floatPetIcon 1.2s ease-out forwards;
}

/* 情緒動作 */
.pet-v7-animal-wrap.anim-greet .pet-v7-animal{
  animation:greetForward .85s ease;
}
.pet-v7-animal-wrap.anim-happy .pet-v7-animal{
  animation:happySpin 1.1s ease;
}
.pet-v7-animal-wrap.anim-tail .pet-v7-animal{
  animation:tailWag 1s ease;
}
.pet-v7-animal-wrap.anim-play .pet-v7-animal{
  animation:playHop 1s ease;
}
.pet-v7-animal-wrap.anim-feed .pet-v7-animal{
  animation:feedNibble .85s ease;
}
.pet-v7-animal-wrap.anim-clean .pet-v7-animal{
  animation:cleanShine .9s ease;
}
.pet-v7-animal-wrap.anim-sleep .pet-v7-animal{
  animation:sleepRest 1.5s ease;
}
.pet-v7-animal-wrap.anim-walk .pet-v7-animal{
  animation:walkForward .95s ease;
}
.pet-v7-animal-wrap.anim-bounce .pet-v7-animal{
  animation:bouncePet .6s ease;
}

@keyframes greetForward{
  0%{transform:translateX(0) translateY(0) scale(1)}
  28%{transform:translateX(-14px) translateY(-18px) scale(1.03) rotate(-3deg)}
  55%{transform:translateX(12px) translateY(-8px) scale(1.09) rotate(3deg)}
  82%{transform:translateX(0) translateY(5px) scale(1.04)}
  100%{transform:translateX(0) translateY(0) scale(1)}
}
@keyframes happySpin{
  0%{transform:translateY(0) rotate(0) scale(1)}
  25%{transform:translateY(-12px) rotate(90deg) scale(1.03)}
  50%{transform:translateY(-20px) rotate(190deg) scale(1.08)}
  75%{transform:translateY(-10px) rotate(290deg) scale(1.04)}
  100%{transform:translateY(0) rotate(360deg) scale(1)}
}
@keyframes tailWag{
  0%,100%{transform:rotate(0) translateY(0)}
  15%{transform:rotate(-8deg) translateY(-4px)}
  30%{transform:rotate(8deg) translateY(-1px)}
  45%{transform:rotate(-8deg) translateY(-4px)}
  60%{transform:rotate(8deg) translateY(-1px)}
  75%{transform:rotate(-6deg) translateY(-3px)}
}
@keyframes playHop{
  0%,100%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-18px) rotate(-8deg)}
  45%{transform:translateY(-34px) rotate(8deg)}
  70%{transform:translateY(-12px) rotate(-4deg)}
}
@keyframes feedNibble{
  0%,100%{transform:translateY(0) scale(1)}
  30%{transform:translateY(8px) scale(.96)}
  60%{transform:translateY(-4px) scale(1.04)}
}
@keyframes cleanShine{
  0%,100%{transform:scale(1); filter:drop-shadow(0 14px 10px rgba(95,59,27,.19))}
  50%{transform:scale(1.03); filter:drop-shadow(0 14px 10px rgba(95,59,27,.19)) brightness(1.18) saturate(.75)}
}
@keyframes sleepRest{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(6px) rotate(2deg)}
  50%{transform:translateY(12px) rotate(4deg)}
  75%{transform:translateY(6px) rotate(2deg)}
}
@keyframes walkForward{
  0%{transform:translateX(0) translateY(0)}
  20%{transform:translateX(-24px) translateY(-6px)}
  40%{transform:translateX(18px) translateY(-2px)}
  60%{transform:translateX(-10px) translateY(-8px)}
  80%{transform:translateX(8px) translateY(-2px)}
  100%{transform:translateX(0) translateY(0)}
}
@keyframes bouncePet{
  0%,100%{transform:translateY(0)}
  45%{transform:translateY(-18px) scale(1.03)}
  75%{transform:translateY(-6px)}
}
@keyframes speechPop{
  0%{opacity:0;transform:translateY(8px)}
  10%,82%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-8px)}
}
@keyframes emotionPulse{
  0%{opacity:0;transform:translateX(110px) scale(.4)}
  30%{opacity:1;transform:translateX(110px) scale(1.12)}
  80%{opacity:1;transform:translateX(110px) scale(1)}
  100%{opacity:0;transform:translateX(110px) scale(.7)}
}
@keyframes floatPetIcon{
  0%{opacity:0;transform:translateY(0) scale(.5)}
  18%{opacity:1}
  100%{opacity:0;transform:translateY(-120px) translateX(20px) scale(1.2)}
}

@media(max-width:1080px){
  .pet-v7-top{grid-template-columns:auto 1fr auto}
  .pet-v7-level{grid-column:1/-1}
  .pet-v7-room{grid-template-columns:220px 1fr}
  .pet-v7-right{display:none}
}
@media(max-width:760px){
  .base-quick-tabs{
    width:calc(100% - 14px);
    margin:10px auto;
  }
  .base-quick-tabs button{
    min-height:46px;
    font-size:15px;
  }
  .pet-home-section-v7{
    width:calc(100% - 12px);
  }
  .pet-v7-top{
    grid-template-columns:1fr auto;
    gap:10px;
  }
  .pet-v7-banner{
    grid-column:1/-1;
    font-size:13px;
  }
  .pet-v7-level{
    grid-column:1/-1;
  }
  .pet-v7-room{
    display:block;
    min-height:790px;
  }
  .pet-v7-left{
    border-right:0;
    padding:10px;
  }
  .pet-v7-love,.pet-v7-missions{
    display:none;
  }
  .pet-v7-pet-list{
    position:relative;
    z-index:10;
  }
  .pet-v7-switch img{
    height:62px;
  }
  .pet-v7-stage{
    min-height:660px;
  }
  .pet-v7-window{
    left:14px;top:18px;width:190px;height:112px;
  }
  .pet-v7-wall-items{
    left:220px;top:28px;gap:8px;
  }
  .pet-v7-wall-items span{
    width:42px;height:42px;font-size:18px;border-width:5px;
  }
  .pet-v7-cat-tree{
    right:16px;top:72px;width:86px;height:145px;
  }
  .pet-v7-stats{
    top:145px;left:12px;width:220px;
  }
  .pet-v7-speech{
    right:10px;top:166px;max-width:170px;font-size:12px;
  }
  .pet-v7-animal-wrap{
    width:74vw;height:320px;bottom:95px;
  }
  .pet-v7-name-card{
    left:12px;right:12px;bottom:16px;min-width:0;
  }
  .pet-v7-bed{
    left:20px;bottom:110px;width:120px;height:52px;
  }
  .pet-v7-bowl{right:120px;bottom:116px;font-size:38px}
  .pet-v7-water{right:76px;bottom:116px;font-size:34px}
  .pet-v7-house{right:16px;bottom:152px;font-size:82px}
  .pet-v7-toys{left:155px;bottom:120px;font-size:28px}
  .pet-v7-actions{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:12px;
  }
}

</style>
</head>

<div class="page">
  <section id="basePage">
    <div class="demo-card" style="width:min(1480px,calc(100% - 24px));margin:0 auto 12px;padding:16px;border:1px solid #ddd;border-radius:16px;background:#fff8ef;color:#6a492c;">
      <b>示範區：</b>這裡代表「我的基地」原本內容。上方可快速切換到「毛孩之家」。
    </div>
  </section>
</div>
<script>

function save(){localStorage.setItem('petHomeV7Demo',JSON.stringify(st));}
function header(){}
function toast(msg){console.log(msg);}
function showBase(){}
function renderBase(){}
</script>
<script>
/* =========================================================
   毛孩之家 V7：互動式情緒反應 + 守護基地快速切換
   - 寵物看到主人會往前迎接
   - 開心會轉圈圈 / 搖尾巴 / 跳跳
   - 守護基地上方快速切換：我的基地 / 毛孩之家
   ========================================================= */
(function(){
  const STORE_KEY='petGuardian';
  const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,Number(n)||0));
  const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const today=()=>new Date().toISOString().slice(0,10);

  const PETS={
    dog:{name:'狗狗',defaultName:'旺旺',img:'pet-dog.png',greet:'汪汪！看到你我超開心！',owner:'看到主人就搖尾巴衝過來！',kind:'忠心夥伴'},
    cat:{name:'貓咪',defaultName:'咪咪',img:'pet-cat.png',greet:'喵～你終於來陪我了！',owner:'看到主人時偷偷開心靠近你。',kind:'撒嬌小夥伴'},
    rabbit:{name:'兔兔',defaultName:'小兔',img:'pet-rabbit.png',greet:'啾啾～今天也一起玩吧！',owner:'兔兔蹦蹦跳跳地迎接你！',kind:'療癒小可愛'}
  };

  function ensureState(){
    if(typeof st==='undefined') return null;

    if(!st[STORE_KEY] || typeof st[STORE_KEY] !== 'object'){
      st[STORE_KEY]={
        petType:'dog',
        petName:'旺旺',
        hunger:82,
        clean:84,
        happy:82,
        energy:88,
        trust:32,
        totalCare:0,
        names:{dog:'旺旺',cat:'咪咪',rabbit:'小兔'},
        game:{date:today(),interactions:0,feeds:0,quizDone:0,rewardClaimed:false}
      };
    }

    const p=st[STORE_KEY];
    if(!PETS[p.petType]) p.petType='dog';
    if(!p.names || typeof p.names!=='object'){
      p.names={dog:'旺旺',cat:'咪咪',rabbit:'小兔'};
    }
    if(!p.petName) p.petName=p.names[p.petType] || PETS[p.petType].defaultName;

    ['hunger','clean','happy','energy','trust'].forEach(k=>{
      p[k]=clamp(p[k] ?? (k==='trust'?32:82));
    });

    p.totalCare=Number(p.totalCare)||0;
    if(!p.game || typeof p.game!=='object') p.game={};
    if(p.game.date!==today()){
      p.game={date:today(),interactions:0,feeds:0,quizDone:0,rewardClaimed:false};
    }
    p.game.interactions=Number(p.game.interactions)||0;
    p.game.feeds=Number(p.game.feeds)||0;
    p.game.quizDone=Number(p.game.quizDone)||0;
    p.game.rewardClaimed=Boolean(p.game.rewardClaimed);
    return p;
  }

  function saveAll(){
    if(typeof save==='function') save();
    if(typeof header==='function') header();
  }

  function petLevel(p){
    return Math.max(1,Math.floor((p.totalCare||0)/8)+1);
  }

  function xpPercent(p){
    return Math.min(100, Math.round(((p.totalCare||0)%8)/8*100));
  }

  function missionState(p){
    return {
      feed: p.game.feeds>=3,
      interact: p.game.interactions>=3,
      quiz: p.game.quizDone>=1
    };
  }

  function missionCount(p){
    return Object.values(missionState(p)).filter(Boolean).length;
  }

  function maybeDailyReward(p){
    const ms=missionState(p);
    if(ms.feed && ms.interact && ms.quiz && !p.game.rewardClaimed){
      p.game.rewardClaimed=true;
      st.coins=(Number(st.coins)||0)+50;
      showToast('🎁 每日任務完成！獲得 50 枚守護金幣');
    }
  }

  function showToast(msg){
    if(typeof toast==='function') toast(msg);
    else console.log(msg);
  }

  function petDom(){
    return {
      panel: document.getElementById('petHomePanel'),
      stage: document.getElementById('petGameStage'),
      wrap: document.getElementById('petGameAnimalWrap'),
      animal: document.getElementById('petGameAnimal'),
      speech: document.getElementById('petSpeech'),
      emotion: document.getElementById('petEmotionBadge')
    };
  }

  function setSpeech(text, emoji='💬'){
    const {speech,emotion}=petDom();
    if(speech){
      speech.textContent=text;
      speech.classList.remove('show');
      void speech.offsetWidth;
      speech.classList.add('show');
    }
    if(emotion){
      emotion.textContent=emoji;
      emotion.classList.remove('show');
      void emotion.offsetWidth;
      emotion.classList.add('show');
    }
  }

  function animatePet(name){
    const {wrap}=petDom();
    if(!wrap) return;
    wrap.classList.remove('anim-greet','anim-happy','anim-tail','anim-play','anim-feed','anim-clean','anim-sleep','anim-walk','anim-bounce');
    void wrap.offsetWidth;
    wrap.classList.add(name);
  }

  function floatEffects(kind='heart'){
    const {stage}=petDom();
    if(!stage) return;
    const pool = kind==='clean' ? ['🫧','✨','🫧','✨'] :
                 kind==='food'  ? ['🥕','🥣','✨','💛'] :
                 kind==='walk'  ? ['🍃','🐾','💚','✨'] :
                 ['💗','✨','💖','💞'];
    for(let i=0;i<6;i++){
      const el=document.createElement('span');
      el.className='pet-v7-float';
      el.textContent=pool[i%pool.length];
      el.style.left=(44+Math.random()*18)+'%';
      el.style.top=(40+Math.random()*18)+'%';
      el.style.animationDelay=(i*0.05)+'s';
      stage.appendChild(el);
      setTimeout(()=>el.remove(),1300);
    }
  }

  function updateAndRender(message, animation, effect='heart', emoji='💗'){
    const p=ensureState(); if(!p) return;
    maybeDailyReward(p);
    saveAll();
    renderPetHome();
    requestAnimationFrame(()=>{
      animatePet(animation || 'anim-bounce');
      floatEffects(effect);
      setSpeech(message, emoji);
    });
  }

  function interact(action){
    const p=ensureState(); if(!p) return;
    const costMap={feed:1};
    const rules={
      pet:   {happy:+6,trust:+5,energy:+1,hunger:0, clean:0,  care:+1, interact:+1, animation:'anim-tail',  effect:'heart', emoji:'💗', text:'被摸摸超開心，我想一直陪著你！'},
      feed:  {happy:+3,trust:+2,energy:+3,hunger:+16,clean:-1,care:+1, feeds:+1,    animation:'anim-feed',  effect:'food',  emoji:'🥣', text:'吃飽飽了！我要搖尾巴給你看！'},
      play:  {happy:+14,trust:+4,energy:-7,hunger:-4,clean:-2,care:+1, interact:+1, animation:'anim-happy', effect:'heart', emoji:'🎉', text:'好好玩！我開心到轉圈圈了！'},
      clean: {happy:+2,trust:+3,energy:-1,hunger:0, clean:+18,care:+1, interact:+1, animation:'anim-clean', effect:'clean', emoji:'🫧', text:'洗香香後，我整個心情都變好了！'},
      sleep: {happy:+2,trust:+1,energy:+22,hunger:-3,clean:0, care:+1,              animation:'anim-sleep', effect:'heart', emoji:'🌙', text:'呼嚕呼嚕……我補充好精神了！'},
      walk:  {happy:+11,trust:+5,energy:-6,hunger:-5,clean:-3,care:+1, interact:+1, animation:'anim-walk',  effect:'walk',  emoji:'🐾', text:'一起散步最棒了！我忍不住開心往前跑！'}
    };

    const r=rules[action];
    if(!r) return;

    const cost=costMap[action]||0;
    const coins=Number(st.coins)||0;
    if(cost>coins){
      showToast('守護金幣不足，先去答題賺金幣吧！');
      return;
    }

    st.coins=coins-cost;
    p.happy =clamp(p.happy +(r.happy||0));
    p.trust =clamp(p.trust +(r.trust||0));
    p.energy=clamp(p.energy+(r.energy||0));
    p.hunger=clamp(p.hunger+(r.hunger||0));
    p.clean =clamp(p.clean +(r.clean||0));
    p.totalCare += Number(r.care||0);

    p.game.feeds += Number(r.feeds||0);
    p.game.interactions += Number(r.interact||0);

    updateAndRender(r.text, r.animation, r.effect, r.emoji);
  }

  function onPetClick(){
    const p=ensureState(); if(!p) return;
    p.happy=clamp(p.happy+2);
    p.trust=clamp(p.trust+1);
    p.game.interactions += 1;
    const lines=[
      PETS[p.petType].greet,
      PETS[p.petType].owner,
      '我一看到你就想靠近你！',
      '今天也陪我一下下好嗎？',
      '你來了，我真的好開心！'
    ];
    updateAndRender(lines[Math.floor(Math.random()*lines.length)], 'anim-greet', 'heart', '😍');
  }

  function renamePet(){
    const p=ensureState(); if(!p) return;
    const name=prompt('幫毛孩取名字：', p.petName);
    if(name===null) return;
    const finalName=(name.trim() || p.petName).slice(0,10);
    p.petName=finalName;
    p.names[p.petType]=finalName;
    saveAll();
    renderPetHome();
    setTimeout(()=>setSpeech(`你好呀！我是 ${finalName} ～`, '✨'), 100);
  }

  function switchPet(type){
    const p=ensureState(); if(!p || !PETS[type]) return;
    p.petType=type;
    p.petName=p.names[type] || PETS[type].defaultName;
    saveAll();
    renderPetHome();
    setTimeout(()=>{
      animatePet('anim-greet');
      setSpeech(`嗨！我是 ${p.petName}，今天也想和你互動！`, '💖');
    },50);
  }

  function registerQuizDone(){
    const p=ensureState(); if(!p) return;
    p.game.quizDone=Math.max(1,p.game.quizDone);
    maybeDailyReward(p);
    saveAll();
    renderPetHome();
  }

  function bar(icon,label,val,cls){
    return `<div class="pet-v7-stat">
      <span>${icon}</span>
      <b>${label}</b>
      <div class="pet-v7-track"><i class="${cls}" style="width:${val}%"></i></div>
      <strong>${val}</strong>
    </div>`;
  }

  function petChoice(type,p){
    const meta=PETS[type];
    const active=p.petType===type;
    const nm=p.names?.[type] || meta.defaultName;
    return `<button class="pet-v7-switch ${active?'active':''}" onclick="petGameSwitch('${type}')">
      <img src="${meta.img}" alt="${meta.name}">
      <small>${meta.name}</small>
      <b>${esc(nm)}</b>
    </button>`;
  }

  function missionRow(done,label,count){
    return `<div class="pet-v7-mission-row ${done?'done':''}">
      <span class="box">${done?'✓':''}</span>
      <b>${label}</b>
      <em>${count}</em>
    </div>`;
  }

  function renderPetHome(){
    const host=document.getElementById('petHomePanel');
    if(!host) return;
    const p=ensureState(); if(!p) return;
    const meta=PETS[p.petType];
    const lv=petLevel(p);
    const ms=missionState(p);
    const done=missionCount(p);
    const coins=Number(st.coins)||0;
    const relation=clamp(Math.round(p.trust*0.6 + p.happy*0.4));

    host.innerHTML=`
      <div class="pet-v7-shell">
        <div class="pet-v7-top">
          <div class="pet-v7-title">🏠 毛孩之家</div>
          <div class="pet-v7-banner">溫馨陪伴、照顧與互動，每天都讓毛孩更愛你！</div>
          <div class="pet-v7-wallet">🐾 <b>${coins}</b></div>
          <div class="pet-v7-level">
            <span>Lv.${lv}</span>
            <div><i style="width:${xpPercent(p)}%"></i></div>
          </div>
        </div>

        <div class="pet-v7-room">
          <aside class="pet-v7-left">
            <div class="pet-v7-love">
              <span>💗</span>
              <small>親密度</small>
              <strong>${relation}</strong>
            </div>

            <div class="pet-v7-missions">
              <h3>每日任務 <small>${done}/3</small></h3>
              ${missionRow(ms.feed,'餵食毛孩 3 次',`${Math.min(3,p.game.feeds)}/3`)}
              ${missionRow(ms.interact,'和毛孩互動 3 次',`${Math.min(3,p.game.interactions)}/3`)}
              ${missionRow(ms.quiz,'完成 1 次毛孩問答',`${Math.min(1,p.game.quizDone)}/1`)}
              <div class="pet-v7-reward">完成獎勵： 🐾 +50</div>
            </div>

            <div class="pet-v7-pet-list">
              ${petChoice('dog',p)}
              ${petChoice('cat',p)}
              ${petChoice('rabbit',p)}
            </div>
          </aside>

          <main class="pet-v7-stage" id="petGameStage">
            <div class="pet-v7-window"></div>
            <div class="pet-v7-wall-items"><span>🐾</span><span>🌱</span><span>💛</span></div>
            <div class="pet-v7-cat-tree"></div>
            <div class="pet-v7-bed"></div>
            <div class="pet-v7-bowl">🥣</div>
            <div class="pet-v7-water">💧</div>
            <div class="pet-v7-toys">🧸　⚽</div>
            <div class="pet-v7-house">🏠</div>

            <div class="pet-v7-speech" id="petSpeech">我是 ${esc(p.petName)}，看到你真的好開心！</div>
            <div class="pet-v7-emotion" id="petEmotionBadge">💖</div>

            <button class="pet-v7-animal-wrap" id="petGameAnimalWrap" type="button" onclick="petGameClick()">
              <img class="pet-v7-animal" id="petGameAnimal" src="${meta.img}" alt="${meta.name}">
            </button>

            <div class="pet-v7-name-card">
              <div class="main">
                <b>${esc(p.petName)}</b>
                <span>${meta.kind}</span>
              </div>
              <small>看到主人會開心往前，點牠也會有情緒反應喔！</small>
              <button type="button" onclick="renamePet()">✏️ 改名</button>
            </div>

            <div class="pet-v7-stats">
              ${bar('💗','心情',p.happy,'pink')}
              ${bar('🥣','飽足',p.hunger,'orange')}
              ${bar('🫧','清潔',p.clean,'green')}
              ${bar('⚡','活力',p.energy,'blue')}
            </div>
          </main>

          <aside class="pet-v7-right">
            <div class="pet-v7-side-box">
              <b>快速互動</b>
              <button class="quick pink" onclick="petGameInteract('pet')">💗 一鍵抱抱</button>
              <button class="quick gold" onclick="petGameInteract('feed')">🥣 一鍵餵食</button>
              <button class="quick mint" onclick="petGameInteract('play')">🎾 一鍵玩耍</button>
            </div>
            <div class="pet-v7-tip">
              💡 毛孩心情高時，會更容易出現開心反應，例如轉圈圈、搖尾巴、往前迎接你。
            </div>
          </aside>
        </div>

        <div class="pet-v7-actions">
          <button type="button" onclick="petGameInteract('feed')"><span>🥣</span><b>餵食</b></button>
          <button type="button" onclick="petGameInteract('play')"><span>🎾</span><b>玩耍</b></button>
          <button type="button" onclick="petGameInteract('pet')"><span>🤲</span><b>摸摸</b></button>
          <button type="button" onclick="petGameInteract('clean')"><span>🫧</span><b>清潔</b></button>
          <button type="button" onclick="petGameInteract('sleep')"><span>🌙</span><b>睡覺</b></button>
          <button type="button" onclick="petGameInteract('walk')"><span>🐾</span><b>散步</b></button>
        </div>
      </div>`;
  }

  function ensurePetSection(){
    const base=document.getElementById('basePage');
    if(!base) return null;

    let section=document.getElementById('petHomeSection');
    if(!section){
      section=document.createElement('section');
      section.id='petHomeSection';
      section.className='pet-home-section-v7';
      section.innerHTML='<div id="petHomePanel"></div>';
      base.appendChild(section);
    }else if(!section.querySelector('#petHomePanel')){
      section.innerHTML='<div id="petHomePanel"></div>';
    }

    renderPetHome();
    return section;
  }

  function ensureBaseTabs(){
    const base=document.getElementById('basePage');
    const pet=ensurePetSection();
    if(!base || !pet) return;

    let tabs=document.getElementById('baseQuickTabs');
    if(!tabs){
      tabs=document.createElement('div');
      tabs.id='baseQuickTabs';
      tabs.className='base-quick-tabs';
      tabs.innerHTML='' +
        '<button type="button" data-mode="my" class="active">🌍 我的基地</button>' +
        '<button type="button" data-mode="pet">🐾 毛孩之家</button>';
      base.insertBefore(tabs, base.firstChild);
      tabs.querySelector('[data-mode="my"]').onclick=()=>switchBaseMode('my');
      tabs.querySelector('[data-mode="pet"]').onclick=()=>switchBaseMode('pet');
    }

    let my=document.getElementById('myBaseView');
    if(!my){
      my=document.createElement('section');
      my.id='myBaseView';
      my.className='base-mode-view';
      base.insertBefore(my, pet);

      const toMove=[...base.children].filter(el =>
        el!==tabs && el!==my && el!==pet
      );
      toMove.forEach(el=>my.appendChild(el));
    }

    return {tabs,my,pet};
  }

  function switchBaseMode(mode='my'){
    const refs=ensureBaseTabs();
    if(!refs) return;
    const {tabs,my,pet}=refs;
    const isPet=mode==='pet';

    my.classList.toggle('is-hidden', isPet);
    pet.classList.toggle('is-hidden', !isPet);
    tabs.querySelectorAll('button').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.mode===mode);
    });

    try{ sessionStorage.setItem('baseMode', mode); }catch(e){}
    if(isPet){
      renderPetHome();
      setTimeout(()=>{
        animatePet('anim-greet');
        const p=ensureState();
        if(p) setSpeech(PETS[p.petType].owner, '😍');
      },80);
    }
    window.scrollTo({top:0,left:0,behavior:'auto'});
  }

  function restoreBaseMode(){
    let mode='my';
    try{
      const m=sessionStorage.getItem('baseMode');
      if(m==='pet') mode='pet';
    }catch(e){}
    switchBaseMode(mode);
  }

  function patchShowBase(){
    const old=window.showBase;
    if(typeof old!=='function' || old.__petV7Patched) return;
    const wrapped=function(){
      const r=old.apply(this,arguments);
      setTimeout(()=>{
        ensureBaseTabs();
        restoreBaseMode();
      },0);
      return r;
    };
    wrapped.__petV7Patched=true;
    window.showBase=wrapped;
  }

  function patchRenderBase(){
    const old=window.renderBase;
    if(typeof old!=='function' || old.__petV7Patched) return;
    const wrapped=function(){
      const r=old.apply(this,arguments);
      setTimeout(()=>{
        ensureBaseTabs();
        renderPetHome();
      },0);
      return r;
    };
    wrapped.__petV7Patched=true;
    window.renderBase=wrapped;
  }

  function install(){
    ensureBaseTabs();
    patchShowBase();
    patchRenderBase();
  }

  window.renderPetHome=renderPetHome;
  window.petGameInteract=interact;
  window.petGameClick=onPetClick;
  window.petGameSwitch=switchPet;
  window.renamePet=renamePet;
  window.petGameRegisterQuizDone=registerQuizDone;
  window.switchBaseMode=switchBaseMode;

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>setTimeout(install, 250), {once:true});
  }else{
    setTimeout(install, 250);
  }
})();
</script>
</body>
</html>
