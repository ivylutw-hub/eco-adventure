<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>毛孩之家｜小狗逐格真互動測試</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3e8d6;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#674526}
.game{width:min(1100px,calc(100% - 20px));margin:18px auto;border:2px solid #a66d35;border-radius:24px;overflow:hidden;background:#f7ddb1;box-shadow:0 14px 32px rgba(89,56,27,.16)}
.top{display:flex;align-items:center;gap:14px;padding:13px 18px;background:linear-gradient(#c7894c,#b87539);color:white}
.top b{font-size:25px} .top span{flex:1;background:#fff0c7;color:#75491f;padding:8px 14px;border-radius:15px;font-weight:900}
.room{position:relative;height:620px;overflow:hidden;background:linear-gradient(#fae9c9 0 75%,#d6a067 75%)}
.window{position:absolute;left:30px;top:28px;width:240px;height:130px;border:10px solid #b57940;border-radius:16px;background:linear-gradient(#9ed9f7 0 65%,#83c35d 65%);display:grid;place-items:center;font-size:30px}
.bed{position:absolute;left:55px;bottom:50px;font-size:80px}
.ball{position:absolute;left:325px;bottom:75px;font-size:45px;transition:transform .5s ease}
.bowl{position:absolute;right:75px;bottom:48px;font-size:65px}
.door{position:absolute;right:8px;top:170px;font-size:110px}
.speech{position:absolute;right:170px;top:125px;max-width:235px;background:#fff9e8;border:3px solid #aa7441;border-radius:18px;padding:12px 16px;font-weight:900;opacity:0;transform:translateY(8px)}
.speech.show{animation:speech 2.4s ease}
.pet{position:absolute;left:50%;bottom:45px;width:270px;height:220px;transform:translateX(-50%);transition:left .8s cubic-bezier(.22,.75,.25,1),bottom .8s cubic-bezier(.22,.75,.25,1),transform .45s ease;z-index:5;display:flex;align-items:flex-end;justify-content:center}
.pet img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 7px rgba(84,52,25,.16));image-rendering:auto}
.pet.front{transform:translateX(-50%) scale(1.10);bottom:72px}
.pet.eating{transform:translateX(-50%) scale(.97)}
.pet.sleeping{transform:translateX(-50%) scale(.94)}
.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:14px 18px;background:#f3d293;border-top:3px solid #a97038}
.actions button{border:2px solid #b77a3c;border-radius:15px;background:linear-gradient(#fff8df,#f3c76d);padding:11px 5px;box-shadow:0 4px 0 #99622f;font-size:23px;cursor:pointer}
.actions button b{display:block;font-size:14px;color:#70471f;margin-top:2px}
.actions button:disabled{opacity:.55;cursor:not-allowed}
.note{position:absolute;left:20px;top:185px;width:245px;padding:12px;border:2px solid #bd8b55;border-radius:15px;background:rgba(255,249,235,.94);line-height:1.6;font-size:13px}
@keyframes speech{0%{opacity:0;transform:translateY(8px)}10%,82%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}
@media(max-width:720px){
  .top{flex-wrap:wrap}.top span{flex-basis:100%}
  .room{height:640px}.window{left:12px;width:175px;height:95px}
  .note{top:145px;width:195px;font-size:11px}
  .pet{width:235px;height:195px}.bowl{right:12px}.door{font-size:80px;right:-10px}
  .speech{right:10px;top:160px;max-width:150px;font-size:12px}
  .actions{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div class="game">
  <div class="top"><b>🐶 小狗互動測試</b><span>先確認小狗的逐格動作自然，再製作其他毛孩</span><strong>Sprite V1</strong></div>
  <div class="room">
    <div class="window">☁️　🌿</div>
    <div class="bed">🛏️</div>
    <div class="ball" id="ball">🔴</div>
    <div class="bowl">🥣</div>
    <div class="door">🚪</div>
    <div class="note">這一版不是旋轉四肢。<br>每一個畫面都直接播放畫好的小狗姿勢，因此走路、跑步、吃飯、睡覺會自然很多。</div>
    <div class="speech" id="speech">你回來了！</div>
    <div class="pet" id="pet"><img id="dog" alt="可愛小狗"></div>
  </div>
  <div class="actions">
    <button onclick="act('greet')">💗<b>迎接主人</b></button>
    <button onclick="act('walk')">🐾<b>走一走</b></button>
    <button onclick="act('feed')">🥣<b>餵食</b></button>
    <button onclick="act('sleep')">🌙<b>睡覺</b></button>
    <button onclick="act('play')">🎾<b>追球</b></button>
    <button onclick="act('idle')">😊<b>待機</b></button>
  </div>
</div>
<script>
const FRAMES={"idle": ["dog_frames/dog_idle_01.png", "dog_frames/dog_idle_02.png", "dog_frames/dog_idle_03.png", "dog_frames/dog_idle_04.png", "dog_frames/dog_idle_05.png"], "walk": ["dog_frames/dog_walk_01.png", "dog_frames/dog_walk_02.png", "dog_frames/dog_walk_03.png", "dog_frames/dog_walk_04.png", "dog_frames/dog_walk_05.png", "dog_frames/dog_walk_06.png", "dog_frames/dog_walk_07.png", "dog_frames/dog_walk_08.png"], "run": ["dog_frames/dog_run_01.png", "dog_frames/dog_run_02.png", "dog_frames/dog_run_03.png", "dog_frames/dog_run_04.png", "dog_frames/dog_run_05.png", "dog_frames/dog_run_06.png", "dog_frames/dog_run_07.png", "dog_frames/dog_run_08.png"], "eat": ["dog_frames/dog_eat_01.png", "dog_frames/dog_eat_02.png", "dog_frames/dog_eat_03.png", "dog_frames/dog_eat_04.png", "dog_frames/dog_eat_05.png", "dog_frames/dog_eat_06.png"], "sleep": ["dog_frames/dog_sleep_01.png", "dog_frames/dog_sleep_02.png", "dog_frames/dog_sleep_03.png", "dog_frames/dog_sleep_04.png", "dog_frames/dog_sleep_05.png"], "play": ["dog_frames/dog_play_01.png", "dog_frames/dog_play_02.png", "dog_frames/dog_play_03.png", "dog_frames/dog_play_04.png", "dog_frames/dog_play_05.png", "dog_frames/dog_play_06.png"]};
const dog=document.getElementById('dog');
const pet=document.getElementById('pet');
const speech=document.getElementById('speech');
const buttons=[...document.querySelectorAll('.actions button')];
let timer=null,busy=false,currentAction='idle',frameIndex=0;

function say(t){
  speech.textContent=t;speech.classList.remove('show');void speech.offsetWidth;speech.classList.add('show');
}
function stopAnim(){if(timer)clearInterval(timer);timer=null}
function loop(action,fps=6){
  stopAnim();currentAction=action;frameIndex=0;
  const arr=FRAMES[action];
  dog.src=arr[0];
  timer=setInterval(()=>{frameIndex=(frameIndex+1)%arr.length;dog.src=arr[frameIndex]},1000/fps);
}
function once(action,fps=7,loops=1){
  return new Promise(resolve=>{
    stopAnim();let idx=0,count=0;const arr=FRAMES[action];dog.src=arr[0];
    timer=setInterval(()=>{
      idx++;if(idx>=arr.length){idx=0;count++;if(count>=loops){clearInterval(timer);timer=null;dog.src=arr[arr.length-1];resolve();return}}
      dog.src=arr[idx];
    },1000/fps);
  });
}
function lock(v){busy=v;buttons.forEach(b=>b.disabled=v)}
function move(left,bottom=45){pet.style.left=left+'%';pet.style.bottom=bottom+'px'}
async function act(a){
  if(busy&&a!=='idle')return;
  lock(true);
  pet.className='pet';
  if(a==='greet'){
    say('你回來了！我跑過來找你！');
    loop('run',10);move(50,72);pet.classList.add('front');
    await new Promise(r=>setTimeout(r,1350));
    await once('idle',5,1);move(50,45);pet.classList.remove('front');
  } else if(a==='walk'){
    say('我去房間裡走一走～');
    loop('walk',9);move(66,45);await new Promise(r=>setTimeout(r,1100));
    move(40,45);await new Promise(r=>setTimeout(r,1100));
    move(50,45);await new Promise(r=>setTimeout(r,700));
  } else if(a==='feed'){
    say('我去吃飯飯囉！');
    loop('walk',9);move(76,45);await new Promise(r=>setTimeout(r,1150));
    pet.classList.add('eating');
    await once('eat',6,2);
    say('吃飽了，好滿足！');
    loop('walk',9);move(50,45);await new Promise(r=>setTimeout(r,1100));
  } else if(a==='sleep'){
    say('我想去床上休息一下。');
    loop('walk',9);move(24,45);await new Promise(r=>setTimeout(r,1200));
    pet.classList.add('sleeping');loop('sleep',3);
    await new Promise(r=>setTimeout(r,2600));
    say('睡飽了！');
    loop('walk',9);pet.classList.remove('sleeping');move(50,45);await new Promise(r=>setTimeout(r,1150));
  } else if(a==='play'){
    say('球球！我要去追！');
    const ball=document.getElementById('ball');
    ball.style.transform='translate(180px,-75px)';
    loop('run',11);move(70,45);await new Promise(r=>setTimeout(r,800));
    ball.style.transform='translate(-120px,-25px)';move(35,45);await new Promise(r=>setTimeout(r,900));
    await once('play',8,1);
    say('抓到球了！');
    ball.style.transform='translate(0,0)';move(50,45);await new Promise(r=>setTimeout(r,800));
  } else {
    say('我在這裡陪你～');
  }
  loop('idle',4);
  pet.className='pet';
  move(50,45);
  lock(false);
}
loop('idle',4);
setTimeout(()=>act('greet'),500);
</script>
</body></html>
