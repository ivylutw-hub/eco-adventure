<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>環保知識競賽｜國際環保公約學習中心</title>
<style>
:root{--green:#237653;--dark:#16382b;--bg:#eff8f3;--gold:#e7a536;--red:#c85c4b;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf8f1,#eef5ff);color:var(--dark);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.hero{background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 10px 30px #00000012}
h1{margin:0;font-size:clamp(26px,5vw,42px)}.hero p{margin:8px 0;color:#5d756b}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.tab{border:0;border-radius:15px;padding:12px 18px;background:#dfeee7;color:#245642;font-weight:800;cursor:pointer}.tab.active{background:var(--green);color:#fff}
.view{display:none}.view.active{display:block}.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.pill{padding:8px 13px;background:#eef8f3;border-radius:999px;font-weight:800}
.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0}button.action{border:0;border-radius:13px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}.action.light{background:#e8f0ed;color:#245642}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border-radius:19px;padding:18px;box-shadow:0 4px 16px #0000000d;border:2px solid transparent}.card:hover{border-color:#76ad94}.year{font-size:16px;color:#7a8c85;font-weight:700}.name{font-size:21px;font-weight:900;margin:7px 0}.tag{display:inline-block;background:#edf6f1;padding:6px 10px;border-radius:9px;font-size:16px;font-weight:800}.memory{margin-top:11px;color:#5c7068;font-size:17px;font-weight:700}.quizbox{background:#fff;border-radius:22px;padding:22px;box-shadow:0 5px 20px #0001}.q{font-size:24px;font-weight:900;line-height:1.6}.opts{display:grid;gap:10px;margin-top:15px}.opt{border:2px solid #dce9e3;background:#fff;border-radius:14px;padding:15px;text-align:left;font-size:18px;font-weight:700;cursor:pointer}.opt.correct{border-color:#4a9a6e;background:#e9f7ee}.opt.wrong{border-color:#d66c5d;background:#fff0ed}.result{min-height:28px;margin:12px 0;font-weight:900}.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}.matchcol{background:#fff;border-radius:22px;padding:18px}.matchcol h3{font-size:21px}.matchitem{padding:13px;margin:8px 0;border:2px solid #dce9e3;border-radius:14px;cursor:pointer;font-weight:800}.matchitem.sel{border-color:var(--gold);background:#fff7e7}.matchitem.done{opacity:.38;pointer-events:none;background:#eaf7ee}.barbg{height:10px;background:#dce9e3;border-radius:99px;overflow:hidden}.bar{height:100%;background:#55a879;width:0}.note{margin-top:14px;background:#fff8df;border-radius:16px;padding:13px;line-height:1.6}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.match{grid-template-columns:1fr}.wrap{padding:10px}.hero{padding:18px}.q{font-size:18px}}
</style></head><body><div class="wrap">
<section class="hero"><h1>🌏 國際環保公約學習中心</h1><p>先認識 → 再配對 → 最後挑戰！把 23 個公約變成真正記得住的環保知識。</p>
<div class="stats"><span class="pill">📚 23 個公約</span><span class="pill">🎮 對對碰</span><span class="pill">🧠 10 題挑戰</span><span class="pill">🏆 學習積分 <b id="total">0</b></span></div></section>
<nav class="tabs"><button class="tab active" onclick="show('guide',this)">📖 23公約圖鑑</button><button class="tab" onclick="show('match',this)">🎮 公約對對碰</button><button class="tab" onclick="show('quiz',this)">🏆 10題挑戰</button></nav>

<section id="guide" class="view active"><div class="controls"><button class="action light" onclick="renderGuide('all')">全部</button><button class="action light" onclick="renderGuide('🌡️ 氣候')">氣候</button><button class="action light" onclick="renderGuide('☁️ 臭氧層')">臭氧層</button><button class="action light" onclick="renderGuide('🌊 海洋')">海洋</button><button class="action light" onclick="renderGuide('🐾 生物多樣性')">生物多樣性</button><button class="action light" onclick="renderGuide('🧪 化學污染')">化學／廢棄物</button></div><div class="grid" id="guideGrid"></div>
<div class="note">💡 <b>快速記憶：</b>蒙特婁／維也納 → 臭氧層；京都／FCCC → 氣候；巴塞爾 → 危險廢棄物；CITES → 野生動植物貿易；拉姆薩 → 濕地；MARPOL → 船舶污染。</div></section>

<section id="match" class="view"><div class="quizbox"><h2>🎮 公約對對碰</h2><p>先點左邊的公約，再點右邊最符合的核心任務。答對 +2 分，答錯不扣分。</p><div class="stats"><span class="pill">已配對 <b id="mDone">0</b></span><span class="pill">本回合 <b id="mScore">0</b> 分</span></div><div class="barbg"><div class="bar" id="mBar"></div></div><div id="mMsg" class="result">準備好了嗎？</div></div><div class="match"><div class="matchcol"><h3>📜 公約／議定書</h3><div id="mNames"></div></div><div class="matchcol"><h3>🎯 核心任務</h3><div id="mDescs"></div></div></div><div class="controls"><button class="action" onclick="newMatch()">🔄 新回合</button></div></section>

<section id="quiz" class="view"><div class="quizbox"><h2>🏆 10 題挑戰</h2><div class="stats"><span class="pill">第 <b id="qNo">1</b> / 10 題</span><span class="pill">得分 <b id="qScore">0</b></span></div><div class="barbg"><div class="bar" id="qBar"></div></div><div id="qArea"></div><div class="controls"><button class="action" onclick="startQuiz()">🔄 重新挑戰</button></div></div></section>
</div>
<script>
const DATA=[{"id": 1, "name": "斯德哥爾摩公約", "year": "2001", "topic": "持久性有機污染物 POPs", "detail": "長時間殘留、會累積、會遠距離傳輸的有機污染物", "key": "POPs", "memory": "想到「毒物會一直留著」", "cat": "🧪 化學污染"}, {"id": 2, "name": "生物安全議定書（卡塔赫納議定書）", "year": "2000", "topic": "基因改造活生物體 LMOs", "detail": "跨境移動的生物安全與事先告知同意", "key": "LMOs／生物安全", "memory": "想到「基改生物跨國要先告知」", "cat": "🧬 生物安全"}, {"id": 3, "name": "鹿特丹公約", "year": "1998", "topic": "危險化學品與農藥國際貿易", "detail": "出口前讓進口國取得資訊並作出知情決定", "key": "PIC／危險化學品", "memory": "想到「危險化學品先問對方」", "cat": "🧪 化學污染"}, {"id": 4, "name": "京都議定書", "year": "1997", "topic": "溫室氣體減量", "detail": "針對工業化國家等設定溫室氣體減量承諾", "key": "溫室氣體／減量", "memory": "想到「京都＝減碳」", "cat": "🌡️ 氣候"}, {"id": 5, "name": "氣候變化綱要公約（FCCC）", "year": "1992", "topic": "全球氣候變化", "detail": "抑制溫室氣體排放，強調共同但有差異的責任", "key": "氣候／溫室氣體", "memory": "想到「氣候總公約」", "cat": "🌡️ 氣候"}, {"id": 6, "name": "生物多樣性公約（CBD）", "year": "1992", "topic": "生物多樣性", "detail": "保育生物多樣性、永續利用、公平分享基因資源利益", "key": "生物多樣性", "memory": "想到「CBD＝保護生命多樣性」", "cat": "🐾 生物多樣性"}, {"id": 7, "name": "二十一世紀議程（Agenda 21）", "year": "1992", "topic": "永續發展行動藍圖", "detail": "規劃全球永續發展的工作方向與執行方法", "key": "永續發展", "memory": "想到「21世紀＝永續藍圖」", "cat": "🌱 永續發展"}, {"id": 8, "name": "里約宣言", "year": "1992", "topic": "永續發展理念", "detail": "兼顧環境與發展、公民參與及未來世代", "key": "永續發展", "memory": "想到「里約＝永續理念」", "cat": "🌱 永續發展"}, {"id": 9, "name": "森林原則", "year": "1992", "topic": "森林永續經營", "detail": "推動森林永續經營，重視原住民權利與生物保育", "key": "森林", "memory": "想到「森林＝永續管理」", "cat": "🌳 森林"}, {"id": 10, "name": "巴塞爾公約", "year": "1989", "topic": "危險廢棄物跨境移動", "detail": "管制危險廢棄物跨境移動與處置，強調事前通報", "key": "危險廢棄物", "memory": "想到「巴塞爾＝危廢跨國運送」", "cat": "♻️ 廢棄物"}, {"id": 11, "name": "海牙宣言", "year": "1989", "topic": "全球溫室效應", "detail": "主張強化國際合作與防止全球溫室效應的措施", "key": "溫室效應", "memory": "想到「海牙＝強化氣候行動」", "cat": "🌡️ 氣候"}, {"id": 12, "name": "赫爾辛基宣言", "year": "1989", "topic": "破壞臭氧層物質", "detail": "管制破壞臭氧層物質，並提出防止溫室效應惡化措施", "key": "臭氧層", "memory": "想到「赫爾辛基＝臭氧」", "cat": "☁️ 臭氧層"}, {"id": 13, "name": "那爾德威克宣言", "year": "1989", "topic": "森林與溫室效應", "detail": "針對溫室效應相關氣體及熱帶森林保護形成共識", "key": "熱帶森林", "memory": "想到「那爾德威克＝森林」", "cat": "🌳 森林"}, {"id": 14, "name": "索非亞協定", "year": "1988", "topic": "氮氧化物 NOx", "detail": "控制氮氧化物排放及跨境移動", "key": "NOx", "memory": "想到「索非亞＝氮氧化物」", "cat": "🌫️ 空氣污染"}, {"id": 15, "name": "蒙特婁議定書", "year": "1987", "topic": "臭氧層破壞物質", "detail": "逐步削減並淘汰 CFCs 等消耗臭氧層物質", "key": "CFCs／臭氧層", "memory": "想到「蒙特婁＝消滅CFC」", "cat": "☁️ 臭氧層"}, {"id": 16, "name": "維也納公約", "year": "1985", "topic": "臭氧層保護", "detail": "建立保護臭氧層的國際合作、研究與資訊交流架構", "key": "臭氧層／研究", "memory": "想到「維也納＝臭氧研究合作」", "cat": "☁️ 臭氧層"}, {"id": 17, "name": "赫爾辛基協定", "year": "1985", "topic": "硫氧化物 SOx／酸雨", "detail": "控制硫氧化物排放及跨境移動，推動酸雨合作", "key": "SOx／酸雨", "memory": "想到「赫爾辛基＝酸雨」", "cat": "🌧️ 空氣污染"}, {"id": 18, "name": "聯合國海洋法公約（UNCLOS）", "year": "1982", "topic": "海洋環境保護", "detail": "規範海洋污染來源與海洋環境保護", "key": "海洋污染", "memory": "想到「海洋法＝保護海洋」", "cat": "🌊 海洋"}, {"id": 19, "name": "長距離跨境大氣污染公約", "year": "1979", "topic": "跨境大氣污染", "detail": "防止空氣污染跨境傳輸，推動監測、研究與合作", "key": "跨境空污", "memory": "想到「空氣會跨國」", "cat": "🌫️ 空氣污染"}, {"id": 20, "name": "國際船舶污染防治公約（MARPOL）", "year": "1978", "topic": "船舶海洋污染", "detail": "管制船舶油污、有害液體、污水、廢棄物等污染", "key": "船舶／海洋污染", "memory": "想到「MARPOL＝船舶污染」", "cat": "🚢 海洋"}, {"id": 21, "name": "瀕臨絕種野生動植物國際貿易公約（CITES）", "year": "1975", "topic": "瀕危野生動植物國際貿易", "detail": "依附錄分級管理野生動植物國際貿易與許可", "key": "野生動植物貿易", "memory": "想到「CITES＝保護瀕危動植物」", "cat": "🐾 生物多樣性"}, {"id": 22, "name": "拉姆薩公約（濕地公約）", "year": "1975", "topic": "國際重要濕地", "detail": "重視濕地保育與合理利用，締約國登錄重要濕地", "key": "濕地", "memory": "想到「拉姆薩＝濕地」", "cat": "🦆 濕地"}, {"id": 23, "name": "倫敦廢棄物投棄公約", "year": "1972", "topic": "海洋廢棄物投棄", "detail": "管制向海洋投棄廢棄物，建立有害物質投棄規範", "key": "海洋投棄", "memory": "想到「倫敦＝海洋不能亂丟」", "cat": "🌊 海洋"}];
let points=0,matchData=[],mSel=null,mDone=0,mScore=0,quiz=[],qi=0,qs=0;
function save(){document.getElementById('total').textContent=points}
function show(id,btn){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='guide')renderGuide('all');if(id==='match')newMatch();if(id==='quiz')startQuiz()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderGuide(filter){let a=filter==='all'?DATA:DATA.filter(x=>x.cat===filter);document.getElementById('guideGrid').innerHTML=shuffle(a).map(x=>`<article class="card"><div class="year">${x.year}｜${x.cat}</div><div class="name">${x.name}</div><span class="tag">${x.key}</span><div class="memory">🧠 ${x.memory}</div><details><summary>查看重點</summary><p>${x.detail}</p></details></article>`).join('')}
function newMatch(){matchData=shuffle(DATA).slice(0,8);mSel=null;mDone=0;mScore=0;document.getElementById('mNames').innerHTML=shuffle(matchData).map(x=>`<div class="matchitem" data-id="${x.id}" onclick="pickN(this,${x.id})">${x.name}</div>`).join('');document.getElementById('mDescs').innerHTML=shuffle(matchData).map(x=>`<div class="matchitem" data-id="${x.id}" onclick="pickD(this,${x.id})">${x.detail}</div>`).join('');updM();document.getElementById('mMsg').textContent='先選公約，再找它的核心任務！'}
function pickN(e,id){document.querySelectorAll('#mNames .matchitem').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');mSel=id;document.getElementById('mMsg').textContent='很好，現在找它的核心任務。'}
function pickD(e,id){if(mSel===null){document.getElementById('mMsg').textContent='請先選左邊的公約。';return}if(id===mSel){document.querySelectorAll(`.matchitem[data-id="${id}"]`).forEach(x=>x.classList.add('done'));mDone++;mScore+=2;points+=2;save();mSel=null;document.getElementById('mMsg').textContent='🎉 配對成功！';if(mDone===matchData.length)document.getElementById('mMsg').textContent='🏆 本回合完成！'}else{document.getElementById('mMsg').textContent='💡 再想一下：看看關鍵字！'}}
function updM(){document.getElementById('mDone').textContent=mDone;document.getElementById('mScore').textContent=mScore;document.getElementById('mBar').style.width=(mDone/8*100)+'%'}
function startQuiz(){quiz=shuffle(DATA).slice(0,10);qi=0;qs=0;showQ()}
function showQ(){if(qi>=10){document.getElementById('qArea').innerHTML=`<div class="q">🎊 挑戰完成！</div><p>你得到 <b>${qs}</b> / 10 分。</p><p>${qs>=9?'🏆 國際環保公約高手！':qs>=7?'🌟 很棒，再把關鍵字複習一次！':'🌱 建議回圖鑑再複習一次，再挑戰！'}</p>`;return}let x=quiz[qi];let wrong=shuffle(DATA.filter(y=>y.id!==x.id)).slice(0,3);let opts=shuffle([x,...wrong]);document.getElementById('qNo').textContent=qi+1;document.getElementById('qScore').textContent=qs;document.getElementById('qBar').style.width=(qi/10*100)+'%';document.getElementById('qArea').innerHTML=`<div class="q">「${x.key}」最可能對應哪一個公約？</div><div class="opts">${opts.map(o=>`<button class="opt" onclick="answerQ(this,${o.id},${x.id})">${o.name}</button>`).join('')}</div><div id="qResult" class="result"></div>`}
function answerQ(btn,id,correct){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(id===correct){btn.classList.add('correct');qs++;points++;save();document.getElementById('qResult').textContent='✅ 答對！';}else{btn.classList.add('wrong');document.querySelectorAll('.opt').forEach(x=>{if(x.textContent===DATA.find(y=>y.id===correct).name)x.classList.add('correct')});document.getElementById('qResult').textContent='💡 正確答案是：'+DATA.find(y=>y.id===correct).name}qi++;setTimeout(showQ,700)}
renderGuide('all');newMatch();startQuiz();
</script></body></html>
