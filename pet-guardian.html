<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>毛孩守護者｜浪牠不流浪</title>
<style>
:root{--green:#0c6b53;--green2:#258f6c;--ink:#263f37;--muted:#6d7b75;--cream:#fffaf0;--line:#dfd7c4;--orange:#e99a2f}
*{box-sizing:border-box}body{margin:0;background:#f2faf5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}button{font:inherit}.app{width:min(1480px,calc(100% - 28px));margin:auto;padding-bottom:30px}
.pet-header{position:relative;overflow:hidden;background:linear-gradient(#8bd8f5 0 56%,#cfeec7 56%);min-height:176px;padding:22px 26px 0;border-radius:0 0 20px 20px}.pet-sky{position:absolute;inset:0;pointer-events:none}.pet-sky span{position:absolute;font-size:35px;opacity:.55}.pet-sky .sun{right:18%;top:20px}.pet-sky .cloud{left:55%;top:20px}.pet-sky .tree{right:5%;bottom:22px}.pet-sky .house{right:14%;bottom:18px}.brand{position:relative;z-index:2;display:flex;align-items:center;gap:13px}.brand-logo{width:50px;height:50px;border-radius:14px;background:#ffffff50;display:grid;place-items:center;font-size:29px}.brand h1{margin:0;color:#075d49;font-size:clamp(28px,4vw,43px)}.brand p{margin:5px 0 0;font-weight:800;color:#315f52}
.pet-top-stats{position:absolute;right:25px;top:25px;z-index:3;display:flex;gap:9px}.stat-pill{background:#ffffffdd;border:1px solid #ffffff;border-radius:15px;padding:9px 13px;font-weight:900}.pet-tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:#fff9}.pet-tabs button{border:0;background:#fffcf5;padding:16px 28px;font-weight:900;color:#503d2e;cursor:pointer;border-bottom:3px solid transparent}.pet-tabs button.active{color:var(--green);border-bottom-color:var(--green)}
.page-actions{display:flex;gap:10px;margin:14px 0}.page-actions button{border:1px solid #cfe2d8;background:#fff;border-radius:13px;padding:9px 15px;color:#0a634e;font-weight:900;cursor:pointer}
.map-card{background:#fffdf7;border:1px solid #e2d9c9;border-radius:24px;padding:20px;margin-top:12px;box-shadow:0 10px 25px #3258470d}.map-title{display:flex;justify-content:space-between;gap:15px;align-items:end}.map-title h2{margin:2px 0 3px;font-size:27px}.map-title p{margin:0;color:var(--muted)}.map-progress-summary{font-weight:900;color:#816238}
.stage{margin-top:18px}.stage-head{display:flex;justify-content:space-between;align-items:center}.stage-head h3{font-size:24px;margin:0}.stage-head small{color:#8d735b}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:10px}.unit{position:relative;min-height:214px;border:1px solid #d9d2c6;border-radius:20px;background:#fff;padding:17px;text-align:left;cursor:pointer;transition:.15s}.unit:hover{transform:translateY(-2px);box-shadow:0 10px 23px #506e5e17}.unit.done{background:#edfff5;border-color:#7ed2a3}.unit.partial{background:#fff8e7;border-color:#efc46d}.unit .emoji{font-size:39px}.unit h4{font-size:20px;margin:8px 0 5px}.unit p{min-height:42px;color:#7d6b5f;margin:0 0 13px;line-height:1.45}.unit-meta{display:flex;justify-content:space-between;color:#806e5f;font-size:13px}.progress{height:10px;background:#eee7dc;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#53bd88,#14815f)}.unit-reward{margin-top:10px;font-size:12px;color:#9a682c}
.hide{display:none!important}.quiz-card{background:#fffdf8;border:1px solid #ded5c6;border-radius:24px;padding:22px;margin-top:14px}.quiz-top{display:flex;justify-content:space-between;font-weight:900}.question{font-size:clamp(22px,4vw,31px);line-height:1.5;margin:22px 0}.opts{display:grid;gap:11px}.opt{border:2px solid #e1d8cb;border-radius:16px;background:#fff;padding:14px;text-align:left;cursor:pointer;font-size:17px}.opt.sel{border-color:#e0a232;background:#fff8e7}.opt.good{border-color:#3da36f;background:#effff5}.opt.bad{border-color:#d46d6d;background:#fff1f1}.actions{display:flex;gap:10px;margin-top:15px}.btn{border:0;border-radius:14px;padding:12px 18px;background:#187c60;color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#fff;color:#236956;border:1px solid #cde0d8}.feedback{padding:15px;border-radius:15px;margin-top:13px;line-height:1.65}.feedback.good{background:#edfff4}.feedback.bad{background:#fff0f0}.result-card{text-align:center}.big-score{font-size:70px;font-weight:1000;color:#11775a}.reward-box{display:flex;justify-content:center;gap:12px;margin:14px 0}.reward-box span{background:#fff6dc;padding:12px 18px;border-radius:15px;font-weight:900}
@media(max-width:800px){.app{width:100%;padding:0 10px 20px}.pet-header{min-height:230px;padding:18px 15px 0}.pet-top-stats{position:relative;right:auto;top:auto;margin-top:12px}.pet-tabs{overflow:auto;justify-content:flex-start}.pet-tabs button{white-space:nowrap;padding:13px 17px}.units{grid-template-columns:1fr}.map-title{align-items:start;flex-direction:column}.page-actions{margin-left:4px}}
</style>
</head>
<body>
<div class="app">
<header class="pet-header">
  <div class="pet-sky"><span class="sun">☀️</span><span class="cloud">☁️</span><span class="tree">🌳</span><span class="house">🏡</span></div>
  <div class="brand"><div class="brand-logo">🐾</div><div><h1>毛孩守護者</h1><p>浪牠不流浪・責任飼養冒險</p></div></div>
  <div class="pet-top-stats"><div class="stat-pill">🪙 守護金幣 <b id="coinCount">--</b></div><div class="stat-pill">📚 題庫 <b id="questionCount">--</b></div></div>
  <nav class="pet-tabs">
    <button class="active" onclick="showPetMap()">🐾 冒險地圖</button>
    <button onclick="goPetBase()">🏡 毛孩之家</button>
    <button onclick="backToEcoHome()">🌍 環保冒險王</button>
  </nav>
</header>

<div class="page-actions"><button onclick="history.back()">← 回上一頁</button><button onclick="showPetMap()">⌂ 回首頁</button></div>

<main id="petMap">
  <section class="map-card">
    <div class="map-title"><div><small>PET GUARDIAN ADVENTURE MAP</small><h2>🐾 毛孩守護冒險地圖</h2><p>完成六個單元，練習成為負責任的毛孩守護者。</p></div><div class="map-progress-summary" id="overallProgress">0 / 6 單元</div></div>
    <div id="cloudState" style="margin-top:8px;color:#6e7e77">☁️ 正在載入題庫與玩家進度…</div>

    <div class="stage">
      <div class="stage-head"><h3>🐕 責任飼主基礎</h3><small>PET STAGE 01</small></div>
      <div class="units" id="pet1Units"></div>
    </div>
    <div class="stage">
      <div class="stage-head"><h3>🐾 動物福利進階</h3><small>PET STAGE 02</small></div>
      <div class="units" id="pet2Units"></div>
    </div>
  </section>
</main>

<main id="quizPage" class="quiz-card hide">
  <div class="quiz-top"><span id="stageLabel"></span><span id="count"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="question" id="q"></div><div class="opts" id="opts"></div>
  <div id="feedback" class="feedback hide"></div>
  <div class="actions"><button class="btn secondary" onclick="showPetMap()">暫停冒險</button><button id="submitBtn" class="btn" onclick="submitAnswer()" disabled>確定送出</button><button id="nextBtn" class="btn hide" onclick="nextQ()">下一題 →</button></div>
</main>

<main id="resultPage" class="map-card result-card hide">
  <div>🎉 UNIT COMPLETE</div><div class="big-score" id="scoreText">0分</div>
  <p id="resultText"></p><div class="reward-box"><span id="coinReward">🪙 +0</span><span id="perfectReward">⭐ --</span></div>
  <button class="btn" onclick="showPetMap()">回毛孩冒險地圖</button>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=10207"></script>
<script>
const STAGES={
 pet1:{name:'責任飼主基礎',fullName:'毛孩守護者・責任飼主基礎',icon:'🐕',reward:2,desc:['安全互動、晶片、醫療、飼養責任','日常照護、散步、飲水與健康觀察','肢體語言、外出安排與友善互動']},
 pet2:{name:'動物福利進階',fullName:'毛孩守護者・動物福利進階',icon:'🐾',reward:4,desc:['動物福利、外來種、救援與情境判斷','特殊寵物、野生動物、棄養與照護責任','通報、安全、野放風險與完整情境判斷']}
};
let BANK={pet1:{1:[],2:[],3:[]},pet2:{1:[],2:[],3:[]}};
let playerState=null,playerDocRef=null,currentUser=null,db=null;
let stageId='',unitNo=1,quiz=[],qi=0,good=0,selected=null,answered=false,replayMode=false;
let syncBusy=false;

function key(s,u){return `${s}|${u}`}
function iso(){return new Date().toISOString()}
function ensureCoreState(){
 if(!playerState||typeof playerState!=='object')playerState={};
 if(!playerState.completed||typeof playerState.completed!=='object')playerState.completed={};
 if(!playerState.unitProgress||typeof playerState.unitProgress!=='object')playerState.unitProgress={};
 if(!playerState.unitScores||typeof playerState.unitScores!=='object')playerState.unitScores={};
 if(!playerState.wrongNotes||typeof playerState.wrongNotes!=='object')playerState.wrongNotes={};
 if(!playerState.coinAwarded||typeof playerState.coinAwarded!=='object')playerState.coinAwarded={};
 if(!playerState.mainExpAwarded||typeof playerState.mainExpAwarded!=='object')playerState.mainExpAwarded={};
 for(const s of ['pet1','pet2']){
   if(!Array.isArray(playerState.completed[s]))playerState.completed[s]=[];
   if(!playerState.unitProgress[s]||typeof playerState.unitProgress[s]!=='object')playerState.unitProgress[s]={};
   if(!playerState.unitScores[s]||typeof playerState.unitScores[s]!=='object')playerState.unitScores[s]={};
 }
 if(!playerState.petGuardian||typeof playerState.petGuardian!=='object')playerState.petGuardian={};
 const p=playerState.petGuardian;
 if(!p.savedSessions||typeof p.savedSessions!=='object')p.savedSessions={};
 return p;
}
function progressOf(s,u){
 ensureCoreState();
 const idx=u-1;
 return {
  answered:Math.max(0,Math.min(10,Number(playerState.unitProgress[s][idx]||0))),
  score:Math.max(0,Number(playerState.unitScores[s][idx]||0)),
  completed:playerState.completed[s].includes(idx),
  perfect:Boolean(playerState.coinAwarded[`${s}|${idx}`])
 };
}
function unitCard(s,u){
 const meta=STAGES[s],list=BANK[s][u]||[],p=progressOf(s,u),pct=list.length?Math.round(Math.min(p.answered,list.length)/list.length*100):0;
 const status=p.completed?(p.perfect?'✅ 已滿分':'✅ 已完成'):p.answered?`進行中：${p.answered}/${list.length}`:'尚未開始';
 return `<button class="unit ${p.completed?'done':p.answered?'partial':''}" onclick="startUnit('${s}',${u})">
  <div class="emoji">${p.completed?'✅':meta.icon}</div><small>UNIT ${u}</small><h4>單元 ${u}</h4><p>${meta.desc[u-1]}</p>
  <div class="unit-meta"><span>${list.length} 題</span><span>${status}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="unit-reward">🎁 首次 10/10 滿分：🪙 +${meta.reward} 守護金幣</div></button>`;
}
function renderMap(){
 if(!playerState)return;
 pet1Units.innerHTML=[1,2,3].map(u=>unitCard('pet1',u)).join('');
 pet2Units.innerHTML=[1,2,3].map(u=>unitCard('pet2',u)).join('');
 const done=['pet1','pet2'].reduce((n,s)=>n+playerState.completed[s].length,0);
 overallProgress.textContent=`${done} / 6 單元`;
 coinCount.textContent=Number(playerState.coins)||0;
 questionCount.textContent=[1,2,3].reduce((n,u)=>n+BANK.pet1[u].length+BANK.pet2[u].length,0);
}
function showPetMap(){petMap.classList.remove('hide');quizPage.classList.add('hide');resultPage.classList.add('hide');renderMap();scrollTo(0,0)}
function goPetBase(){try{sessionStorage.setItem('ecoGoPetBase','1')}catch(e){}location.href='index.html'}
function backToEcoHome(){try{sessionStorage.setItem('ecoReturnToHome','1')}catch(e){}location.href='index.html'}

function petMonsterFor(q){
 const t=((q?.q||'')+' '+(q?.exp||'')).toLowerCase();
 if(/棄養|認養|飼主|責任/.test(t))return {emoji:'🐕‍🦺',name:'棄養迷霧獸',weakness:'負責任飼養、認養前評估與終身照護'};
 if(/晶片|登記|走失/.test(t))return {emoji:'🏷️',name:'走失迷蹤怪',weakness:'晶片、寵物登記與正確身分管理'};
 if(/醫療|獸醫|生病|健康|中暑/.test(t))return {emoji:'🩺',name:'疏忽病痛獸',weakness:'觀察健康訊號並及時尋求獸醫協助'};
 if(/野放|外來種|生態|野生/.test(t))return {emoji:'🌿',name:'野放失衡怪',weakness:'不任意野放，尊重原生生態與野生動物'};
 if(/害怕|低吼|哈氣|肢體|陌生|互動/.test(t))return {emoji:'🐾',name:'界線干擾怪',weakness:'讀懂動物肢體語言並尊重牠的安全距離'};
 if(/飲水|食物|餵|清潔|環境|空間/.test(t))return {emoji:'🥣',name:'照護缺角獸',weakness:'提供乾淨飲水、適當飲食、清潔環境與活動空間'};
 return {emoji:'🐾',name:'毛孩迷霧怪',weakness:'用正確動保知識尊重生命與動物需求'};
}
function wrongKey(q){return `${stageId}|${q.id}`}
function recordWrong(q){
 ensureCoreState();
 const k=wrongKey(q),prev=playerState.wrongNotes[k]||{},m=petMonsterFor(q);
 playerState.wrongNotes[k]={
   ...prev,key:k,stageId,stageName:STAGES[stageId].fullName,unit:unitNo,level:q.level||'毛孩守護',
   question:q.q,explanation:q.exp,options:q.opts,answer:q.ans,attempts:(prev.attempts||0)+1,
   firstWrongAt:prev.firstWrongAt||iso(),lastWrongAt:iso(),mastered:false,masteredAt:null,
   monsterName:m.name,monsterEmoji:m.emoji,monsterWeakness:m.weakness
 };
}
function markMastered(q){
 const k=wrongKey(q);
 if(playerState.wrongNotes[k]&&!playerState.wrongNotes[k].mastered){
   playerState.wrongNotes[k].mastered=true;
   playerState.wrongNotes[k].masteredAt=iso();
 }
}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function recordActivity(ok){
 playerState.totalAnswered=(Number(playerState.totalAnswered)||0)+1;
 if(ok)playerState.totalCorrect=(Number(playerState.totalCorrect)||0)+1;
 const today=todayKey();
 if(playerState.todayAnsweredDate!==today){playerState.todayAnsweredDate=today;playerState.todayAnswered=0}
 playerState.todayAnswered=(Number(playerState.todayAnswered)||0)+1;
}
function awardFirstCorrectExp(q){
 ensureCoreState();
 const k=`${stageId}|${q.id}`;
 if(playerState.mainExpAwarded[k])return 0;
 playerState.mainExpAwarded[k]=true;
 playerState.exp=(Number(playerState.exp)||0)+10;
 return 10;
}

async function syncState(reason='save'){
 if(!playerDocRef||!playerState||syncBusy)return;
 syncBusy=true;
 try{
  ensureCoreState();
  playerState.savedAt=iso();
  // Transaction merges with the newest remote state so pet answers do not erase
  // changes made by the main environmental-knowledge game.
  await db.runTransaction(async tx=>{
    const snap=await tx.get(playerDocRef);
    const remote=snap.exists?(snap.data()||{}):{};
    const rs=remote.state||{};
    const merged={...rs,...playerState};

    // Objects changed by both systems must be explicitly merged.
    for(const field of ['completed','unitProgress','unitScores','wrongNotes','coinAwarded','mainExpAwarded']){
      merged[field]={...(rs[field]||{}),...(playerState[field]||{})};
    }
    merged.petGuardian={...(rs.petGuardian||{}),...(playerState.petGuardian||{})};
    merged.coins=Number(playerState.coins)||0;
    merged.exp=Number(playerState.exp)||0;
    merged.savedAt=playerState.savedAt;
    playerState=merged;

    tx.set(playerDocRef,{
      coins:merged.coins,
      guardianExp:merged.exp,
      totalAnswered:Number(merged.totalAnswered)||0,
      todayAnswered:Number(merged.todayAnswered)||0,
      todayAnsweredDate:merged.todayAnsweredDate||'',
      state:merged,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
  });
  cloudState.textContent=`✅ 已自動存檔・${reason}`;
  coinCount.textContent=Number(playerState.coins)||0;
 }catch(e){
  console.error('毛孩自動存檔失敗',e);
  cloudState.textContent='⚠️ 自動存檔失敗，請確認網路後再試';
 }finally{syncBusy=false}
}

async function init(){
 try{
  if(!firebase.apps.length)firebase.initializeApp(window.ECO_FIREBASE_CONFIG);
  const auth=firebase.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  currentUser=await new Promise(resolve=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;resolve(auth.currentUser)}},3000);const unsub=auth.onAuthStateChanged(u=>{if(done)return;done=true;clearTimeout(t);unsub();resolve(u)})});
  if(!currentUser){cloudState.textContent='🔐 請先回環保冒險王用 Google 登入。';return}
  db=firebase.firestore();playerDocRef=db.collection('players').doc(currentUser.uid);
  const [playerSnap,qSnap]=await Promise.all([playerDocRef.get(),db.collection('customQuestions').where('active','==',true).limit(500).get()]);
  const d=playerSnap.exists?playerSnap.data():{};
  playerState={...(d.state||{})};
  playerState.coins=Number(d.coins??playerState.coins)||0;
  playerState.exp=Number(d.guardianExp??playerState.exp)||0;
  ensureCoreState();
  qSnap.docs.forEach(doc=>{
    const x=doc.data()||{},s=String(x.stageId||'').toLowerCase(),u=Number(x.unit)||1;
    if(BANK[s]&&BANK[s][u])BANK[s][u].push({id:doc.id,q:x.q,opts:x.opts||[],ans:Number(x.ans)||0,exp:x.exp||'',level:x.level||''});
  });
  // deterministic order, so saved qi always returns to the same next question
  for(const s of ['pet1','pet2'])for(const u of [1,2,3])BANK[s][u].sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  cloudState.textContent=`✅ 已登入・毛孩題庫 ${[1,2,3].reduce((n,u)=>n+BANK.pet1[u].length+BANK.pet2[u].length,0)} 題・自動存檔開啟`;
  renderMap();
 }catch(e){console.error(e);cloudState.textContent='⚠️ 題庫或玩家資料讀取失敗，請回主站確認登入後再試。'}
}

function startUnit(s,u){
 stageId=s;unitNo=u;quiz=(BANK[s][u]||[]).slice(0,10);
 if(!quiz.length){alert('這個單元目前沒有題目');return}
 ensureCoreState();
 const idx=u-1,p=progressOf(s,u);
 replayMode=p.completed;
 if(replayMode){qi=0;good=0}
 else{qi=Math.min(p.answered,quiz.length-1);good=p.score}
 petMap.classList.add('hide');resultPage.classList.add('hide');quizPage.classList.remove('hide');
 if(!replayMode&&p.answered>0)cloudState.textContent=`☁️ 已接續上次進度：${p.answered}/${quiz.length} 題`;
 renderQ();
}
function renderQ(){
 answered=false;selected=null;const x=quiz[qi];
 stageLabel.textContent=`${STAGES[stageId].icon} ${STAGES[stageId].name}・單元 ${unitNo}`;
 count.textContent=`${qi+1}/${quiz.length}`;
 bar.style.width=`${qi/quiz.length*100}%`;q.textContent=x.q;opts.innerHTML='';
 x.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${o}`;b.onclick=()=>selectAnswer(i);opts.appendChild(b)});
 feedback.className='feedback hide';feedback.innerHTML='';submitBtn.disabled=true;submitBtn.classList.remove('hide');nextBtn.classList.add('hide');
}
function selectAnswer(i){if(answered)return;selected=i;[...opts.children].forEach((b,j)=>b.classList.toggle('sel',j===i));submitBtn.disabled=false}

async function submitAnswer(){
 if(selected===null||answered)return;
 answered=true;
 const x=quiz[qi],ok=selected===x.ans;
 let expGained=0;
 if(ok){good++;recordActivity(true);expGained=awardFirstCorrectExp(x);markMastered(x)}
 else{recordActivity(false);recordWrong(x)}
 [...opts.children].forEach((b,j)=>{b.disabled=true;b.classList.remove('sel');if(ok&&j===selected)b.classList.add('good');if(!ok&&j===selected)b.classList.add('bad')});

 feedback.className='feedback '+(ok?'good':'bad');
 feedback.innerHTML=ok
 ?`<b>✅ 答對了！</b><br><b>解析：</b>${x.exp}<br><small>${expGained?`✨ +${expGained} EXP`:'本題經驗值已領取，不重複計分'}</small>`
 :`<b>🤔 這題已記進「怪獸弱點圖鑑」</b><br><b>解析：</b>${x.exp}<br><small>之後可回「環保知識 → 怪獸弱點圖鑑」再次挑戰。</small>`;

 if(!replayMode){
   const idx=unitNo-1;
   playerState.unitProgress[stageId][idx]=Math.min(quiz.length,qi+1);
   playerState.unitScores[stageId][idx]=good;
   playerState.petGuardian.savedSessions[key(stageId,unitNo)]={nextIndex:Math.min(quiz.length,qi+1),score:good,updatedAt:iso()};
 }
 await syncState(`第 ${qi+1} 題已儲存`);
 submitBtn.classList.add('hide');nextBtn.classList.remove('hide');
}
function nextQ(){if(!answered)return;qi++;if(qi>=quiz.length)finish();else renderQ()}

async function finish(){
 ensureCoreState();
 const idx=unitNo-1,wasCompleted=playerState.completed[stageId].includes(idx),perfect=good===quiz.length;
 const coinKey=`${stageId}|${idx}`,firstPerfect=perfect&&!playerState.coinAwarded[coinKey],reward=STAGES[stageId].reward;
 if(!wasCompleted)playerState.completed[stageId].push(idx);
 if(firstPerfect){playerState.coins=(Number(playerState.coins)||0)+reward;playerState.coinAwarded[coinKey]=true}
 playerState.unitProgress[stageId][idx]=10;playerState.unitScores[stageId][idx]=good;
 delete playerState.petGuardian.savedSessions[key(stageId,unitNo)];
 await syncState(firstPerfect?`首次滿分，+${reward} 守護金幣`:'單元完成');

 const pct=Math.round(good/quiz.length*100);
 quizPage.classList.add('hide');resultPage.classList.remove('hide');scoreText.textContent=`${pct}分`;
 resultText.textContent=perfect
  ?(firstPerfect?`10 題全部答對，獲得 ${reward} 枚守護金幣！`:'本單元滿分獎勵已領取，不重複獲得金幣。')
  :(wasCompleted?'本次未全對，因此不獲得金幣。':'首次完成單元，但未全對，因此不獲得金幣。');
 coinReward.textContent=firstPerfect?`🪙 +${reward}`:(perfect?'🪙 已領取':'🪙 未獲得');
 perfectReward.textContent=perfect?'⭐ 滿分守護者':'⭐ 再挑戰滿分';
 coinCount.textContent=Number(playerState.coins)||0;replayMode=false;scrollTo(0,0);
}
init();
</script>
</body></html>
