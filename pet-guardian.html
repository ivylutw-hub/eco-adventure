<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>毛孩守護者｜PaGamO 模擬練習</title>
<style>
:root{
  --ink:#34251f;--muted:#7b6860;--bg:#fff7ed;--card:#fff;--line:#ead8ca;
  --main:#d97706;--main2:#f59e0b;--good:#15803d;--bad:#b91c1c;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:linear-gradient(#fff7ed,#fffbeb);color:var(--ink);min-height:100vh;
}
button{font:inherit}
.wrap{max-width:960px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
.top a,.btn{
  border:0;border-radius:14px;padding:12px 18px;font-weight:800;text-decoration:none;cursor:pointer
}
.top a{background:#fff;border:1px solid var(--line);color:var(--ink)}
.hero{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;
  box-shadow:0 12px 30px #7c2d1210
}
.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}
.hero p{color:var(--muted);margin:0;line-height:1.6}
.cloud{margin-top:10px;font-size:14px;color:var(--muted)}

.stage-wrap{margin-top:20px}
.stage-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.stage-title h2{margin:0}
.stage-title small{color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.units{grid-template-columns:1fr}}
.unit{
  background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;text-align:left;cursor:pointer;
  transition:.15s transform,.15s border-color;
}
.unit:hover{border-color:var(--main2);transform:translateY(-1px)}
.unit .icon{font-size:34px}
.unit h3{margin:8px 0 4px}
.unit p{color:var(--muted);margin:0 0 12px;line-height:1.5}
.unit .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:10px;background:#f3e8dc;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--main);width:0}

.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px}
.hide{display:none!important}
.qtop{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;gap:12px}
.question{font-size:clamp(21px,4vw,30px);line-height:1.45;margin:22px 0}
.opts{display:grid;gap:12px}
.opt{
  border:2px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;
  font-size:17px;cursor:pointer;line-height:1.45
}
.opt.sel{border-color:var(--main2);background:#fffbeb}
.opt.good{border-color:var(--good);background:#f0fdf4}
.opt.bad{border-color:var(--bad);background:#fef2f2}
.actions{display:flex;gap:10px;margin-top:18px}
.btn{background:var(--main);color:#fff;flex:1}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.feedback{margin-top:16px;padding:16px;border-radius:14px;line-height:1.7}
.feedback.good{background:#f0fdf4}
.feedback.bad{background:#fef2f2}
.result{text-align:center}
.score{font-size:72px;font-weight:900;color:var(--main)}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.result-grid div{background:#fff7ed;border-radius:14px;padding:14px}
.result-grid small{display:block;color:var(--muted)}
.result-grid b{font-size:22px}
.notice{margin-top:14px;padding:12px;border-radius:14px;background:#fffaf3;color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html" onclick="return backToEcoHome(event)">← 回環保冒險王</a>
    <b>🐾 毛孩守護者</b>
  </div>

  <section class="hero">
    <h1>🐶 浪牠不流浪：毛孩守護者</h1>
    <p>獨立練習區。毛孩題庫使用 pet1 / pet2，與原本環保知識競賽 s1～s4 分開。</p>
    <div id="cloudState" class="cloud">☁️ 正在讀取毛孩題庫…</div>
  </section>

  <section id="home">
    <div class="stage-wrap">
      <div class="stage-title">
        <h2>🐕 責任飼主基礎</h2>
        <small>PET STAGE 01</small>
      </div>
      <div class="units" id="pet1Units"></div>
    </div>

    <div class="stage-wrap">
      <div class="stage-title">
        <h2>🐾 動物福利進階</h2>
        <small>PET STAGE 02</small>
      </div>
      <div class="units" id="pet2Units"></div>
    </div>

    <div class="notice">
      每個單元最多使用 10 題。完成後會記錄本機最高答對題數；重新挑戰不會影響原本「環保冒險王」的 s1～s4 進度。
    </div>
  </section>

  <section id="quiz" class="card hide">
    <div class="qtop">
      <span id="stageLabel"></span>
      <span id="count"></span>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div id="q" class="question"></div>
    <div id="opts" class="opts"></div>
    <div id="feedback" class="feedback hide"></div>
    <div class="actions">
      <button class="btn secondary" onclick="goHome()">回首頁</button>
      <button id="submit" class="btn" onclick="submitAnswer()" disabled>確定送出</button>
      <button id="next" class="btn hide" onclick="nextQ()">下一題</button>
    </div>
  </section>

  <section id="result" class="card result hide">
    <div>🎉 完成練習</div>
    <div id="score" class="score">0</div>
    <div class="result-grid">
      <div><small>答對</small><b id="correctText">0</b></div>
      <div><small>題數</small><b id="totalText">0</b></div>
      <div><small>正確率</small><b id="rateText">0%</b></div>
    </div>
    <p id="resultText"></p>
    <button class="btn" onclick="goHome()">回毛孩守護者首頁</button>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=710"></script>
<script>
const PET_STAGES={
  pet1:{name:'責任飼主基礎',icon:'🐕',unitDesc:[
    '安全互動、晶片、醫療、飼養責任',
    '日常照護、散步、飲水與健康觀察',
    '肢體語言、外出安排與友善互動'
  ]},
  pet2:{name:'動物福利進階',icon:'🐾',unitDesc:[
    '動物福利、外來種、救援與情境判斷',
    '特殊寵物、野生動物、棄養與照護責任',
    '通報、安全、野放風險與完整情境判斷'
  ]}
};

let BANK={pet1:{1:[],2:[],3:[]},pet2:{1:[],2:[],3:[]}};
let stageId='',unitNo=1,quiz=[],qi=0,good=0,selected=null,answered=false;
const KEY='petGuardianProgressV2';
let prog={};
try{
  prog=JSON.parse(localStorage.getItem(KEY)||'{}')||{};
}catch(e){prog={}}

function pkey(stage,unit){return `${stage}|${unit}`}
function saveProg(){
  localStorage.setItem(KEY,JSON.stringify(prog));
  renderUnits();
}
function bestFor(stage,unit){return Number(prog[pkey(stage,unit)]||0)}

function unitCard(stage,unit){
  const meta=PET_STAGES[stage];
  const total=(BANK[stage][unit]||[]).length;
  const best=bestFor(stage,unit);
  const pct=total?Math.round(Math.min(best,total)/total*100):0;
  return `
  <button class="unit" onclick="startUnit('${stage}',${unit})">
    <div class="icon">${meta.icon}</div>
    <small>UNIT ${unit}</small>
    <h3>單元 ${unit}</h3>
    <p>${meta.unitDesc[unit-1]||'毛孩守護練習'}</p>
    <div class="meta"><span>${total} 題</span><span>最佳 ${best}/${total||10}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
  </button>`;
}

function renderUnits(){
  document.getElementById('pet1Units').innerHTML=[1,2,3].map(u=>unitCard('pet1',u)).join('');
  document.getElementById('pet2Units').innerHTML=[1,2,3].map(u=>unitCard('pet2',u)).join('');
}

async function loadBank(){
  try{
    if(!window.ECO_FIREBASE_CONFIG || typeof firebase==='undefined'){
      throw new Error('Firebase 尚未載入');
    }

    if(!firebase.apps.length)firebase.initializeApp(window.ECO_FIREBASE_CONFIG);

    // 先恢復主網站已登入的 Google 帳號，再讀取受規則保護的題庫。
    const auth=firebase.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

    const user=await new Promise(resolve=>{
      let settled=false;
      const timer=setTimeout(()=>{
        if(!settled){settled=true;resolve(auth.currentUser||null);}
      },3000);
      const unsub=auth.onAuthStateChanged(u=>{
        if(settled)return;
        settled=true;
        clearTimeout(timer);
        unsub();
        resolve(u||null);
      });
    });

    if(!user){
      cloudState.textContent='🔐 尚未登入。請先回「環保冒險王」使用 Google 登入，再進入毛孩守護者。';
      renderUnits();
      return;
    }

    cloudState.textContent='☁️ 已登入，正在讀取毛孩題庫…';
    const db=firebase.firestore();
    const snap=await db.collection('customQuestions')
      .where('active','==',true)
      .limit(500)
      .get();

    snap.docs.forEach(d=>{
      const x=d.data()||{};
      const sid=String(x.stageId||'').toLowerCase();
      const u=Number(x.unit)||1;
      if(BANK[sid] && BANK[sid][u]){
        BANK[sid][u].push({
          id:d.id,
          level:x.level||'',
          q:x.q||'',
          opts:Array.isArray(x.opts)?x.opts.slice(0,4):[],
          ans:Number(x.ans)||0,
          exp:x.exp||''
        });
      }
    });

    const total1=[1,2,3].reduce((n,u)=>n+BANK.pet1[u].length,0);
    const total2=[1,2,3].reduce((n,u)=>n+BANK.pet2[u].length,0);
    cloudState.textContent=`✅ 題庫已載入：責任飼主 ${total1} 題・動物福利 ${total2} 題`;
    renderUnits();

  }catch(e){
    console.error('毛孩題庫讀取失敗',e);
    cloudState.textContent='⚠️ 毛孩題庫讀取失敗。請先回主網站確認 Google 已登入，再重新進入。';
    renderUnits();
  }
}

function startUnit(stage,unit){
  stageId=stage;
  unitNo=unit;
  quiz=(BANK[stage][unit]||[]).slice(0,10);
  if(!quiz.length){
    alert(`這個單元目前沒有題目。\n請確認管理後臺已匯入 ${stage}、unit=${unit} 的題目。`);
    return;
  }
  qi=0;good=0;selected=null;answered=false;
  home.classList.add('hide');
  result.classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  renderQ();
}

function renderQ(){
  answered=false;selected=null;
  const x=quiz[qi];
  stageLabel.textContent=`${PET_STAGES[stageId].icon} ${PET_STAGES[stageId].name}・單元 ${unitNo}`;
  count.textContent=`${qi+1}/${quiz.length}`;
  bar.style.width=(qi/quiz.length*100)+'%';
  q.textContent=x.q;
  opts.innerHTML='';
  x.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${o}`;
    b.onclick=()=>selectAnswer(i);
    opts.appendChild(b);
  });
  feedback.className='feedback hide';
  feedback.innerHTML='';
  submit.disabled=true;
  submit.classList.remove('hide');
  next.classList.add('hide');
}

function selectAnswer(i){
  if(answered)return;
  selected=i;
  [...opts.children].forEach((b,j)=>b.classList.toggle('sel',i===j));
  submit.disabled=false;
}

function submitAnswer(){
  if(selected===null||answered)return;
  answered=true;
  const x=quiz[qi];
  const ok=selected===x.ans;
  if(ok)good++;

  [...opts.children].forEach((b,j)=>{
    b.disabled=true;
    b.classList.remove('sel');
    if(j===x.ans)b.classList.add('good');
    if(j===selected&&!ok)b.classList.add('bad');
  });

  feedback.className='feedback '+(ok?'good':'bad');
  feedback.innerHTML=
    `<b>${ok?'✅ 答對了！':'❌ 這題再記一下'}</b><br>`+
    `正確答案：${String.fromCharCode(65+x.ans)}<br>`+
    `<b>解析：</b>${x.exp}`;

  submit.classList.add('hide');
  next.classList.remove('hide');
}

function nextQ(){
  qi++;
  if(qi>=quiz.length)finish();
  else renderQ();
}

function finish(){
  const key=pkey(stageId,unitNo);
  prog[key]=Math.max(Number(prog[key]||0),good);
  saveProg();

  document.getElementById('quiz').classList.add('hide');
  result.classList.remove('hide');

  const pct=Math.round(good/quiz.length*100);
  score.textContent=`${pct}分`;
  correctText.textContent=good;
  totalText.textContent=quiz.length;
  rateText.textContent=`${pct}%`;
  resultText.textContent=
    pct===100?'太棒了！這個單元全部答對。':
    pct>=80?'表現很好，再把錯題複習一次就更穩。':
    '先看懂解析，再重新挑戰一次。';
}

function goHome(){
  document.getElementById('quiz').classList.add('hide');
  result.classList.add('hide');
  home.classList.remove('hide');
  renderUnits();
}

renderUnits();
loadBank();
</script>

<script>
function backToEcoHome(event){
  if(event) event.preventDefault();
  try{ sessionStorage.setItem('ecoReturnToHome','1'); }catch(e){}
  window.location.href='index.html';
  return false;
}
</script>

</body>
</html>
